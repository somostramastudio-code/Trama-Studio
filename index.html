  const sub = p.items.reduce((a,it)=>a+(Number(it.precio||0)*Number(it.cantidad||1)),0);
  const totalDesc = sub - (sub*(Number(p.descuento||0)/100));
  const total = totalDesc + Number(p.adicionales||0);
  abrirModal({
    titulo:`Presupuesto #${p.numero}`, ancho:true,
    cuerpoHTML:`
      <div class="hoja-presupuesto" id="hojaImprimir">
        <div class="logo-presu">${logo}</div>
        <p class="texto-gris" style="font-size:0.78rem;">${escapeHTML(STATE.config.nombreAgencia)} · ${escapeHTML(STATE.config.correo)} · ${escapeHTML(STATE.config.telefono)}</p>
        <h2 style="margin-top:20px;">Propuesta para ${escapeHTML(p.cliente)}</h2>
        <p class="texto-gris" style="font-size:0.8rem;">Fecha: ${fechaVista(p.fecha)} · Válido hasta: ${fechaVista(p.validez)}</p>
        <table>
          <thead><tr><th>Servicio</th><th>Descripción</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead>
          <tbody>${p.items.map(it=>`<tr><td>${escapeHTML(it.servicio)}</td><td>${escapeHTML(it.descripcion)}</td><td>${it.cantidad}</td><td>${moneda(it.precio)}</td><td>${moneda(it.precio*it.cantidad)}</td></tr>`).join('')}</tbody>
        </table>
        ${p.descuento?`<p>Descuento: ${p.descuento}%</p>`:''}
        ${p.adicionales?`<p>Adicionales: ${moneda(p.adicionales)}</p>`:''}
        <div class="total-final">Total: ${moneda(total)}</div>
        <hr class="linea">
        <p style="font-size:0.82rem;"><strong>Forma de pago:</strong> ${escapeHTML(p.formaPago)}</p>
        <p style="font-size:0.82rem; margin-top:6px;"><strong>Condiciones:</strong> ${escapeHTML(p.condiciones)}</p>
        <p style="font-size:0.8rem; margin-top:18px; font-style:italic; color:#8a8580;">Esta propuesta fue desarrollada especialmente para acompañar las necesidades y objetivos de la marca. Los valores pueden ajustarse en caso de modificarse el alcance, los entregables o la frecuencia del servicio.</p>
        <p class="script" style="margin-top:24px; font-size:1.6rem;">trama studio</p>
      </div>
    `,
    footerHTML:`<button class="btn outline" id="btnImprimirPresu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">${iconoSvg('print')}</svg> Imprimir / PDF</button><button class="btn rosa" id="btnCerrarVer">Cerrar</button>`,
    onAbrir:()=>{
      document.getElementById('btnCerrarVer').onclick = cerrarModal;
      document.getElementById('btnImprimirPresu').onclick = ()=>{
        const contenido = document.getElementById('hojaImprimir').outerHTML;
        const w = window.open('', '_blank');
        w.document.write(`<html><head><title>Presupuesto ${p.numero}</title><style>
          body{font-family:'Raleway',sans-serif; padding:30px;} h2{font-family:'Times New Roman',serif;}
          table{width:100%; border-collapse:collapse; margin:14px 0;} th,td{border:1px solid #ddd; padding:8px; text-align:left; font-size:13px;}
          th{background:#0a0a0a; color:#fff;} .total-final{text-align:right; font-size:22px; margin-top:10px;}
          .logo-mark{font-size:22px;} .t1{font-style:italic;} .t2{color:#c9899a; font-weight:700;}
        </style></head><body>${contenido}</body></html>`);
        w.document.close(); w.focus();
        setTimeout(()=>w.print(), 300);
      };
    }
  });
}

/* ---------------------------------------------------------------------
   12. TAREAS
--------------------------------------------------------------------- */
const ESTADOS_TAREA = ['pendiente','en_proceso','en_revision','finalizada'];
function estadoTareaLabel(e){ return {pendiente:'Pendiente', en_proceso:'En proceso', en_revision:'En revisión', finalizada:'Finalizada'}[e]||e; }
let VISTA_TAREAS = 'kanban';
let FILTRO_TAREAS = {cliente:'', prioridad:'', texto:''};

function renderTareas(root){
  const clientes = [...new Set(STATE.tareas.map(t=>t.cliente).filter(Boolean))];
  root.innerHTML = `
    <div class="pagina-header">
      <div><h1>Tareas</h1><div class="sub">${STATE.tareas.filter(t=>t.estado!=='finalizada').length} pendientes de ${STATE.tareas.length} totales</div></div>
      <div class="pagina-acciones"><button class="btn rosa" id="btnNuevaTarea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('plus')}</svg>Nueva tarea</button></div>
    </div>
    <div class="toolbar">
      <input type="text" id="ftTexto" placeholder="Buscar tarea…" value="${escapeHTML(FILTRO_TAREAS.texto)}">
      <select id="ftCliente"><option value="">Todos los clientes</option>${clientes.map(c=>`<option ${FILTRO_TAREAS.cliente===c?'selected':''}>${escapeHTML(c)}</option>`).join('')}</select>
      <select id="ftPrioridad"><option value="">Toda prioridad</option>${['baja','media','alta','urgente'].map(p=>`<option value="${p}" ${FILTRO_TAREAS.prioridad===p?'selected':''}>${capitaliza(p)}</option>`).join('')}</select>
      <div class="vista-toggle">
        <button data-v="kanban" class="${VISTA_TAREAS==='kanban'?'activo':''}">Kanban</button>
        <button data-v="tabla" class="${VISTA_TAREAS==='tabla'?'activo':''}">Tabla</button>
      </div>
    </div>
    <div id="tareasContenido"></div>
  `;
  document.getElementById('btnNuevaTarea').onclick = ()=>abrirFormTarea();
  document.getElementById('ftTexto').oninput = (e)=>{FILTRO_TAREAS.texto=e.target.value; renderPagina();};
  document.getElementById('ftCliente').onchange = (e)=>{FILTRO_TAREAS.cliente=e.target.value; renderPagina();};
  document.getElementById('ftPrioridad').onchange = (e)=>{FILTRO_TAREAS.prioridad=e.target.value; renderPagina();};
  root.querySelectorAll('.vista-toggle button').forEach(b=>b.onclick=()=>{VISTA_TAREAS=b.dataset.v; renderPagina();});

  const tareasFiltradas = STATE.tareas.filter(t=>{
    const okTexto = !FILTRO_TAREAS.texto || t.titulo.toLowerCase().includes(FILTRO_TAREAS.texto.toLowerCase());
    const okCli = !FILTRO_TAREAS.cliente || t.cliente===FILTRO_TAREAS.cliente;
    const okPrio = !FILTRO_TAREAS.prioridad || t.prioridad===FILTRO_TAREAS.prioridad;
    return okTexto && okCli && okPrio;
  });
  const cont = document.getElementById('tareasContenido');
  cont.innerHTML = VISTA_TAREAS==='kanban' ? renderKanbanTareas(tareasFiltradas) : renderTablaTareas(tareasFiltradas);
  activarAccionesTareas(cont);
  if(VISTA_TAREAS==='kanban') activarDragTareas(cont);
}
function renderKanbanTareas(lista){
  return `<div class="kanban">${ESTADOS_TAREA.map(e=>{
    const items = lista.filter(t=>t.estado===e);
    return `<div class="kanban-col" data-estado="${e}">
      <h4>${estadoTareaLabel(e)} <span>${items.length}</span></h4>
      <div class="kanban-cards">${items.map(t=>`
        <div class="kanban-card" draggable="true" data-id="${t.id}">
          <div class="titulo-card">${escapeHTML(t.titulo)}</div>
          <div class="texto-gris" style="font-size:0.72rem;">${escapeHTML(t.cliente||'General')}</div>
          <div class="meta-card"><span class="pill ${t.prioridad}">${t.prioridad}</span><span>${fechaVista(t.fechaEntrega)}</span></div>
        </div>`).join('')}</div>
    </div>`;
  }).join('')}</div>`;
}
function renderTablaTareas(lista){
  lista = [...lista].sort((a,b)=>(a.fechaEntrega||'').localeCompare(b.fechaEntrega||''));
  if(lista.length===0) return `<div class="estado-vacio"><span class="script">Sin tareas</span></div>`;
  return `<div class="tabla-wrap"><table>
    <thead><tr><th>Tarea</th><th>Cliente</th><th>Categoría</th><th>Prioridad</th><th>Estado</th><th>Entrega</th><th></th></tr></thead>
    <tbody>${lista.map(t=>`
      <tr><td>${escapeHTML(t.titulo)}</td><td>${escapeHTML(t.cliente)||'—'}</td><td>${escapeHTML(t.categoria)}</td>

}
function activarAccionesTareas(cont){
  cont.querySelectorAll('.kanban-card').forEach(card=>card.onclick=()=>abrirFormTarea(card.dataset.id));
  cont.querySelectorAll('[data-editar-tar]').forEach(b=>b.onclick=()=>abrirFormTarea(b.dataset.editarTar));
  cont.querySelectorAll('[data-eliminar-tar]').forEach(b=>b.onclick=()=>{
    confirmarAccion('¿Eliminar esta tarea?', ()=>{ STATE.tareas=STATE.tareas.filter(x=>x.id!==b.dataset.eliminarTar); marcarCambio(renderPagina); toast('Tarea eliminada','exito'); });
  });
}
function activarDragTareas(cont){
  let arrastrando = null;
  cont.querySelectorAll('.kanban-card').forEach(card=>{
    card.addEventListener('dragstart', ()=>{arrastrando=card.dataset.id; card.classList.add('arrastrando');});
    card.addEventListener('dragend', ()=>card.classList.remove('arrastrando'));
  });
  cont.querySelectorAll('.kanban-col').forEach(col=>{
    col.addEventListener('dragover', e=>{e.preventDefault(); col.classList.add('sobre');});
    col.addEventListener('dragleave', ()=>col.classList.remove('sobre'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('sobre');
      const t = STATE.tareas.find(x=>x.id===arrastrando);
      if(t){ t.estado = col.dataset.estado; marcarCambio(renderPagina); toast('Tarea movida a "'+estadoTareaLabel(t.estado)+'"','exito'); }
    });
  });
}

/* ---------------------------------------------------------------------
   12b. CALENDARIO
--------------------------------------------------------------------- */
const TIPOS_EVENTO = ['Publicación','Producción','Reunión','Fecha de entrega','Vencimiento','Seguimiento comercial','Evento','Recordatorio'];
const COLORES_TIPO = {
  'Publicación':'#ecb6c1','Producción':'#f6cfd6','Reunión':'#0a0a0a','Fecha de entrega':'#c9899a',
  'Vencimiento':'#a1352d','Seguimiento comercial':'#8a6a2f','Evento':'#4d7a48','Recordatorio':'#8a8580',
};
let VISTA_CALENDARIO = 'mensual';
let MES_CALENDARIO = hoy().slice(0,7);
let FILTRO_CAL = {cliente:'', tipo:''};

function eventosFiltrados(){
  return STATE.eventos.filter(e=>{
    const okCli = !FILTRO_CAL.cliente || e.cliente===FILTRO_CAL.cliente;
    const okTipo = !FILTRO_CAL.tipo || e.tipo===FILTRO_CAL.tipo;
    return okCli && okTipo;
  });
}

function renderCalendario(root){
  const clientesConEventos = [...new Set(STATE.eventos.map(e=>e.cliente).filter(Boolean))];
  root.innerHTML = `
    <div class="pagina-header">
      <div><h1>Calendario</h1><div class="sub">Publicaciones, producciones, reuniones y vencimientos</div></div>
      <div class="pagina-acciones"><button class="btn rosa" id="btnNuevoEvento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('plus')}</svg>Nuevo evento</button></div>
    </div>
    <div class="toolbar">
      <select id="fCalCliente"><option value="">Todos los clientes</option>${clientesConEventos.map(c=>`<option ${FILTRO_CAL.cliente===c?'selected':''}>${escapeHTML(c)}</option>`).join('')}</select>
      <select id="fCalTipo"><option value="">Todos los tipos</option>${TIPOS_EVENTO.map(t=>`<option ${FILTRO_CAL.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
      <div class="vista-toggle">
        <button data-v="mensual" class="${VISTA_CALENDARIO==='mensual'?'activo':''}">Mensual</button>
        <button data-v="semanal" class="${VISTA_CALENDARIO==='semanal'?'activo':''}">Semanal</button>
        <button data-v="lista" class="${VISTA_CALENDARIO==='lista'?'activo':''}">Lista</button>
      </div>
    </div>
    <div class="grid-2 grid-cal">
      <div id="calContenido"></div>
      <div class="panel">
        <h3>Próximos eventos</h3>
        ${renderProximosEventos()}
      </div>
    </div>
  `;
  document.getElementById('btnNuevoEvento').onclick = ()=>abrirFormEvento();
  document.getElementById('fCalCliente').onchange = (e)=>{FILTRO_CAL.cliente=e.target.value; renderPagina();};
  document.getElementById('fCalTipo').onchange = (e)=>{FILTRO_CAL.tipo=e.target.value; renderPagina();};
  root.querySelectorAll('.vista-toggle button').forEach(b=>b.onclick=()=>{VISTA_CALENDARIO=b.dataset.v; renderPagina();});

  const cont = document.getElementById('calContenido');
  if(VISTA_CALENDARIO==='mensual') cont.innerHTML = renderVistaMensual();
  else if(VISTA_CALENDARIO==='semanal') cont.innerHTML = renderVistaSemanal();
  else cont.innerHTML = renderVistaListaEventos();
  activarAccionesCalendario(cont);
}

function renderProximosEventos(){
  const proximos = eventosFiltrados().filter(e=>e.fecha>=hoy()).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,6);
  if(proximos.length===0) return `<div class="estado-vacio"><span class="script">Sin eventos próximos</span></div>`;
  return `<ul class="lista-simple">${proximos.map(e=>`
    <li><div style="display:flex; align-items:center; gap:8px;"><span style="width:8px;height:8px;border-radius:50%;background:${e.color||COLORES_TIPO[e.tipo]||'#8a8580'};flex-shrink:0;"></span>
    <div><div class="nombre">${escapeHTML(e.titulo)}</div><div class="detalle">${escapeHTML(e.cliente||e.tipo)} · ${fechaVista(e.fecha)}${e.horario?' · '+e.horario:''}</div></div></div></li>`).join('')}</ul>`;
}

function renderVistaMensual(){
  const [anio, mes] = MES_CALENDARIO.split('-').map(Number);
  const primerDia = new Date(anio, mes-1, 1);
  const ultimoDia = new Date(anio, mes, 0);
  const diasEnMes = ultimoDia.getDate();
  const offsetInicio = (primerDia.getDay()+6)%7; // lunes=0
  const eventos = eventosFiltrados();
  const nombreMes = primerDia.toLocaleDateString('es-AR',{month:'long', year:'numeric'});

  let celdas = '';
  for(let i=0;i<offsetInicio;i++) celdas += `<div class="cal-celda vacia"></div>`;
  for(let d=1; d<=diasEnMes; d++){
    const fechaISO = `${anio}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evDia = eventos.filter(e=>e.fecha===fechaISO);
    const esHoy = fechaISO===hoy();
    celdas += `<div class="cal-celda ${esHoy?'hoy':''}" data-fecha="${fechaISO}">
      <div class="cal-num">${d}</div>
      <div class="cal-eventos">${evDia.slice(0,3).map(e=>`<div class="cal-evento" style="background:${e.color||COLORES_TIPO[e.tipo]||'#8a8580'}" data-id="${e.id}" title="${escapeHTML(e.titulo)}">${escapeHTML(e.titulo)}</div>`).join('')}
      ${evDia.length>3?`<div class="cal-mas">+${evDia.length-3} más</div>`:''}</div>
    </div>`;
  }
  return `
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
        <button class="icon-btn" id="calMesAnterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('chevron-left')}</svg></button>
        <h3 style="text-transform:capitalize; margin:0;">${nombreMes}</h3>
        <button class="icon-btn" id="calMesSiguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('chevron-right')}</svg></button>
      </div>
      <div class="cal-grid-header">${['L','M','X','J','V','S','D'].map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="cal-grid">${celdas}</div>
    </div>
  `;
}

function renderVistaSemanal(){
  const hoyD = new Date();
  const diaSemana = (hoyD.getDay()+6)%7;
  const lunes = new Date(hoyD); lunes.setDate(hoyD.getDate()-diaSemana);
  const eventos = eventosFiltrados();
  let cols = '';
  for(let i=0;i<7;i++){
    const d = new Date(lunes); d.setDate(lunes.getDate()+i);
    const fechaISO = d.toISOString().slice(0,10);
    const evDia = eventos.filter(e=>e.fecha===fechaISO);
    const esHoy = fechaISO===hoy();
    cols += `<div class="cal-col-semana ${esHoy?'hoy':''}" data-fecha="${fechaISO}">
      <div class="cal-col-header">${d.toLocaleDateString('es-AR',{weekday:'short'})} <strong>${d.getDate()}</strong></div>
      <div class="cal-col-eventos">
        ${evDia.length===0?`<p class="texto-gris" style="font-size:0.7rem;">Sin eventos</p>`:evDia.map(e=>`<div class="cal-evento" style="background:${e.color||COLORES_TIPO[e.tipo]||'#8a8580'}" data-id="${e.id}">${escapeHTML(e.titulo)}${e.horario?' · '+e.horario:''}</div>`).join('')}
      </div>
    </div>`;
  }
  return `<div class="panel"><h3>Semana del ${fechaVista(lunes.toISOString().slice(0,10))}</h3><div class="cal-semana">${cols}</div></div>`;
}

function renderVistaListaEventos(){
  const eventos = [...eventosFiltrados()].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(eventos.length===0) return `<div class="estado-vacio"><span class="script">Sin eventos</span><p>Creá tu primer evento para verlo acá.</p></div>`;
  return `<div class="tabla-wrap"><table>
    <thead><tr><th>Fecha</th><th>Título</th><th>Cliente</th><th>Tipo</th><th>Estado</th><th></th></tr></thead>
    <tbody>${eventos.map(e=>`
      <tr><td>${fechaVista(e.fecha)}${e.horario?' · '+e.horario:''}</td><td>${escapeHTML(e.titulo)}</td><td>${escapeHTML(e.cliente)||'—'}</td>
      <td><span class="pill pendiente">${escapeHTML(e.tipo)}</span></td><td>${escapeHTML(e.estado)||'—'}</td>
      <td class="acciones-fila">
        <button data-editar-evt="${e.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('edit')}</svg></button>
        <button data-eliminar-evt="${e.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('trash')}</svg></button>
      </td></tr>`).join('')}</tbody>
  </table></div>`;
}

function activarAccionesCalendario(cont){
  const btnAnt = document.getElementById('calMesAnterior');
  const btnSig = document.getElementById('calMesSiguiente');
  if(btnAnt) btnAnt.onclick = ()=>{ const [a,m]=MES_CALENDARIO.split('-').map(Number); const d=new Date(a,m-2,1); MES_CALENDARIO=d.toISOString().slice(0,7); renderPagina(); };
  if(btnSig) btnSig.onclick = ()=>{ const [a,m]=MES_CALENDARIO.split('-').map(Number); const d=new Date(a,m,1); MES_CALENDARIO=d.toISOString().slice(0,7); renderPagina(); };
  cont.querySelectorAll('.cal-celda[data-fecha]').forEach(celda=>{
    celda.addEventListener('click', (e)=>{
      if(e.target.closest('.cal-evento')) return;
      abrirFormEvento(null, celda.dataset.fecha);
    });
  });
  cont.querySelectorAll('.cal-evento[data-id]').forEach(ev=>{
    ev.addEventListener('click', (e)=>{ e.stopPropagation(); abrirFormEvento(ev.dataset.id); });
  });
  cont.querySelectorAll('[data-editar-evt]').forEach(b=>b.onclick=()=>abrirFormEvento(b.dataset.editarEvt));
  cont.querySelectorAll('[data-eliminar-evt]').forEach(b=>b.onclick=()=>{
    confirmarAccion('¿Eliminar este evento?', ()=>{
      STATE.eventos = STATE.eventos.filter(x=>x.id!==b.dataset.eliminarEvt);
      marcarCambio(renderPagina); toast('Evento eliminado','exito');
    });
  });
}

function abrirFormEvento(id, fechaPrefill){
  const editando = !!id;
  const e = editando ? STATE.eventos.find(x=>x.id===id) : {
    titulo:'', cliente:'', tipo:'Evento', fecha:fechaPrefill||hoy(), horario:'', descripcion:'',
    estado:'Programado', color:COLORES_TIPO['Evento'], recordatorio:false
  };
  const nombresClientes = STATE.clientes.map(c=>c.marca);
  abrirModal({
    titulo: editando?'Editar evento':'Nuevo evento', ancho:true,
    cuerpoHTML:`
      <div class="campo"><label>Título <span class="req">*</span></label><input id="e_titulo" value="${escapeHTML(e.titulo)}"></div>
      <div class="fila-campos tres">
        <div class="campo"><label>Cliente</label><input id="e_cliente" list="lista_clientes_e" value="${escapeHTML(e.cliente)}"><datalist id="lista_clientes_e">${nombresClientes.map(n=>`<option value="${escapeHTML(n)}">`).join('')}</datalist></div>
        <div class="campo"><label>Tipo</label><select id="e_tipo">${TIPOS_EVENTO.map(t=>`<option ${e.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="campo"><label>Estado</label><select id="e_estado">${['Programado','Confirmado','Realizado','Cancelado','Pendiente'].map(s=>`<option ${e.estado===s?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="fila-campos">
        <div class="campo"><label>Fecha</label><input type="date" id="e_fecha" value="${e.fecha}"></div>
        <div class="campo"><label>Horario</label><input type="time" id="e_horario" value="${e.horario}"></div>
      </div>
      <div class="campo"><label>Descripción</label><textarea id="e_descripcion">${escapeHTML(e.descripcion)}</textarea></div>
      <div class="campo">
        <label>Recordatorio</label>
        <div class="checklist-item"><input type="checkbox" id="e_recordatorio" ${e.recordatorio?'checked':''}><span>Marcar con recordatorio destacado</span></div>
      </div>
    `,
    footerHTML:`${editando?`<button class="btn peligro" id="btnEliminarEventoModal">Eliminar</button>`:''}<button class="btn outline" id="btnCancelarEvt">Cancelar</button><button class="btn rosa" id="btnGuardarEvt">Guardar</button>`,
    onAbrir:()=>{
      document.getElementById('btnCancelarEvt').onclick = cerrarModal;
      const btnElim = document.getElementById('btnEliminarEventoModal');
      if(btnElim) btnElim.onclick = ()=>{
        confirmarAccion('¿Eliminar este evento?', ()=>{
          STATE.eventos = STATE.eventos.filter(x=>x.id!==e.id);
          cerrarModal(); marcarCambio(renderPagina); toast('Evento eliminado','exito');
        });
      };
      document.getElementById('btnGuardarEvt').onclick = ()=>{
        const titulo = val('e_titulo');
        if(!titulo){ toast('El título es obligatorio','error'); return; }
        const tipo = val('e_tipo');
        const datos = {titulo, cliente:val('e_cliente'), tipo, estado:val('e_estado'), fecha:val('e_fecha'),
          horario:val('e_horario'), descripcion:val('e_descripcion'), color:COLORES_TIPO[tipo]||'#8a8580',
          recordatorio: document.getElementById('e_recordatorio').checked};
        if(editando) Object.assign(e, datos); else STATE.eventos.push({id:uid('evt'), ...datos});
        cerrarModal(); marcarCambio(renderPagina); toast(editando?'Evento actualizado':'Evento creado','exito');
      };
    }
  });
}

      <select id="fProdCliente"><option value="">Todos los clientes</option>${clientes.map(c=>`<option ${FILTRO_PROD.cliente===c?'selected':''}>${escapeHTML(c)}</option>`).join('')}</select>

        <button data-v="kanban" class="${VISTA_PRODUCCIONES==='kanban'?'activo':''}">Kanban</button>

  `;

function renderMetricas(root){
  const clientes = [...new Set(STATE.metricas.map(m=>m.cliente).filter(Boolean))];

  root.innerHTML = `
    <div class="pagina-header">
      <div><h1>Métricas</h1><div class="sub">Resultados de redes sociales por cliente y mes</div></div>
      <div class="pagina-acciones"><button class="btn rosa" id="btnNuevaMetrica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('plus')}</svg>Cargar métrica</button></div>
    </div>
    ${registros.length===0 ? `<div class="estado-vacio"><span class="script">Sin métricas cargadas</span><p>Cargá el primer registro mensual de un cliente para empezar a ver comparaciones.</p></div>` : `
    <div class="tabla-wrap"><table>
      <thead><tr><th>Mes</th><th>Cliente</th><th>Seguidores</th><th>Crecimiento</th><th>Alcance</th><th>Interacciones</th><th>Engagement</th><th></th></tr></thead>
      <tbody>${registros.map(m=>{
        const crecimiento = Number(m.seguidoresIniciales)>0 ? (((Number(m.seguidoresFinales)-Number(m.seguidoresIniciales))/Number(m.seguidoresIniciales))*100).toFixed(1) : '0';
        const engagement = Number(m.seguidoresFinales)>0 ? ((Number(m.interacciones||0)/Number(m.seguidoresFinales))*100).toFixed(1) : '0';
        return `<tr><td>${m.mes||'—'}</td><td>${escapeHTML(m.cliente)}</td><td>${m.seguidoresFinales||'—'}</td>
        <td style="color:${crecimiento<0?'#a1352d':'#4d7a48'};">${crecimiento}%</td><td>${m.alcance||'—'}</td><td>${m.interacciones||'—'}</td><td>${engagement}%</td>
        <td class="acciones-fila">
          <button data-editar-met="${m.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('edit')}</svg></button>
          <button data-eliminar-met="${m.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('trash')}</svg></button>
        </td></tr>`;
      }).join('')}</tbody>
    </table></div>
    <div class="grid-2" style="margin-top:24px;">
      <div class="panel"><h3>Crecimiento de seguidores por mes</h3><canvas id="chartCrecimiento" height="230"></canvas></div>
      <div class="panel"><h3>Comparación de alcance por cliente</h3><canvas id="chartAlcanceCliente" height="230"></canvas></div>
    </div>
    `}
  `;
  document.getElementById('btnNuevaMetrica').onclick = ()=>abrirFormMetrica();
  root.querySelectorAll('[data-editar-met]').forEach(b=>b.onclick=()=>abrirFormMetrica(b.dataset.editarMet));
  root.querySelectorAll('[data-eliminar-met]').forEach(b=>b.onclick=()=>{
    confirmarAccion('¿Eliminar este registro de métricas?', ()=>{
      STATE.metricas = STATE.metricas.filter(x=>x.id!==b.dataset.eliminarMet);
      marcarCambio(renderPagina); toast('Registro eliminado','exito');
    });
  });
  if(registros.length>0) setTimeout(()=>{
    if(typeof Chart === 'undefined') return;
    const porCliente = {};
    registros.forEach(m=>{ (porCliente[m.cliente] = porCliente[m.cliente]||[]).push(m); });
    const ctx1 = document.getElementById('chartCrecimiento');
    if(ctx1){
      const datasets = Object.entries(porCliente).slice(0,5).map(([cliente, regs], i)=>{
        const ordenados = [...regs].sort((a,b)=>(a.mes||'').localeCompare(b.mes||''));
        return {label:cliente, data:ordenados.map(r=>Number(r.seguidoresFinales)||0), borderColor:['#0a0a0a','#ecb6c1','#c9899a','#8a8580','#4d7a48'][i%5], fill:false, tension:0.3};
      });
      const meses = [...new Set(registros.map(r=>r.mes))].sort();
      new Chart(ctx1, {type:'line', data:{labels:meses, datasets}, options:{plugins:{legend:{position:'bottom', labels:{font:{size:10}}}}}});
    }
    const ctx2 = document.getElementById('chartAlcanceCliente');
    if(ctx2){
      const ultimoPorCliente = Object.entries(porCliente).map(([cliente,regs])=>{
        const ultimo = [...regs].sort((a,b)=>(b.mes||'').localeCompare(a.mes||''))[0];
        return [cliente, Number(ultimo.alcance)||0];
      });
      new Chart(ctx2, {type:'bar', data:{labels:ultimoPorCliente.map(c=>c[0]), datasets:[{label:'Alcance', data:ultimoPorCliente.map(c=>c[1]), backgroundColor:'#ecb6c1'}]}, options:{plugins:{legend:{display:false}}}});
    }
  },0);
}

let MES_RENTABILIDAD = hoy().slice(0,7);
let CRONOMETRO = {activo:false, inicioTS:null, cliente:'', tarea:'', intervalId:null};

function renderRentabilidad(root){
  const valorHora = Number(STATE.config.valorHora)||0;
  const clientesConMovimiento = [...new Set([
    ...STATE.ingresos.filter(i=>i.mes===MES_RENTABILIDAD).map(i=>i.cliente),
    ...STATE.registroHoras.filter(h=>h.fecha && h.fecha.slice(0,7)===MES_RENTABILIDAD).map(h=>h.cliente),
  ].filter(Boolean))];

  const filas = clientesConMovimiento.map(cliente=>{
    const ingreso = STATE.ingresos.filter(i=>i.cliente===cliente && i.mes===MES_RENTABILIDAD).reduce((a,i)=>a+Number(i.importe||0),0);
    const gastos = STATE.gastos.filter(g=>g.cliente===cliente && g.fecha && g.fecha.slice(0,7)===MES_RENTABILIDAD).reduce((a,g)=>a+Number(g.importe||0),0);
    const horas = STATE.registroHoras.filter(h=>h.cliente===cliente && h.fecha && h.fecha.slice(0,7)===MES_RENTABILIDAD).reduce((a,h)=>a+Number(h.horas||0),0);
    const costoHoras = horas*valorHora;
    const gananciaReal = ingreso - gastos - costoHoras;
    const margen = ingreso>0 ? (gananciaReal/ingreso*100) : 0;
    return {cliente, ingreso, gastos, horas, costoHoras, gananciaReal, margen};
  }).sort((a,b)=>b.gananciaReal-a.gananciaReal);

  const opciones = [];
  const hoyD = new Date();
  for(let i=-5;i<=1;i++){
    const d = new Date(hoyD.getFullYear(), hoyD.getMonth()+i, 1);
    const val = d.toISOString().slice(0,7);
    opciones.push(`<option value="${val}" ${val===MES_RENTABILIDAD?'selected':''}>${d.toLocaleDateString('es-AR',{month:'long', year:'numeric'})}</option>`);
  }

  const tareasConHoras = STATE.tareas.filter(t=>Number(t.horasEstimadas)>0 || Number(t.horasReales)>0);
  const diffHoras = tareasConHoras.map(t=>({titulo:t.titulo, estimadas:Number(t.horasEstimadas)||0, reales:Number(t.horasReales)||0, dif:(Number(t.horasReales)||0)-(Number(t.horasEstimadas)||0)}))
    .sort((a,b)=>Math.abs(b.dif)-Math.abs(a.dif)).slice(0,8);

  root.innerHTML = `
    <div class="pagina-header">
      <div><h1>Rentabilidad y horas</h1><div class="sub">Margen real por cliente y control de tiempo trabajado</div></div>
      <div class="pagina-acciones">
        <label class="texto-gris" style="font-size:0.78rem; margin-right:6px;">Mes:</label>
        <select id="selectorMesRent">${opciones.join('')}</select>
        <button class="btn rosa" id="btnCargarHoras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('plus')}</svg>Cargar horas</button>
      </div>
    </div>

    <div class="panel" style="margin-bottom:24px;">
      <h3>Cronómetro</h3>
      <div class="fila-campos tres" style="align-items:end;">
        <div class="campo"><label>Cliente</label><input id="cr_cliente" list="lista_clientes_cr" ${CRONOMETRO.activo?'disabled':''} value="${escapeHTML(CRONOMETRO.cliente)}"><datalist id="lista_clientes_cr">${STATE.clientes.map(c=>`<option value="${escapeHTML(c.marca)}">`).join('')}</datalist></div>
        <div class="campo"><label>Tarea (opcional)</label><input id="cr_tarea" ${CRONOMETRO.activo?'disabled':''} value="${escapeHTML(CRONOMETRO.tarea)}"></div>
        <div class="campo" style="display:flex; align-items:center; gap:10px;">
          <span id="cronoTiempo" class="editorial" style="font-size:1.5rem;">00:00:00</span>
          ${CRONOMETRO.activo
            ? `<button class="btn peligro chico" id="btnDetenerCrono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;">${iconoSvg('square')}</svg> Detener</button>`
            : `<button class="btn rosa chico" id="btnIniciarCrono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;">${iconoSvg('play')}</svg> Iniciar</button>`}
        </div>
      </div>
    </div>

    ${filas.length===0 ? `<div class="estado-vacio"><span class="script">Sin movimientos este mes</span><p>Cuando registres ingresos y horas para este mes, la rentabilidad por cliente va a aparecer acá.</p></div>` : `
    <div class="tabla-wrap" style="margin-bottom:24px;"><table>
      <thead><tr><th>Cliente</th><th>Ingreso</th><th>Gastos</th><th>Horas</th><th>Costo de horas</th><th>Ganancia real</th><th>Margen</th></tr></thead>
      <tbody>${filas.map(f=>`
        <tr><td><strong>${escapeHTML(f.cliente)}</strong></td><td>${moneda(f.ingreso)}</td><td>${moneda(f.gastos)}</td>
        <td>${f.horas}h</td><td>${moneda(f.costoHoras)}</td>
        <td style="color:${f.gananciaReal<0?'#a1352d':'#4d7a48'};">${moneda(f.gananciaReal)}</td><td>${f.margen.toFixed(0)}%</td></tr>`).join('')}</tbody>
    </table></div>`}

    <div class="grid-2">
      <div class="panel">
        <h3>Diferencia horas estimadas vs. reales</h3>
        ${diffHoras.length===0 ? `<div class="estado-vacio"><p>Cargá horas estimadas y reales en Tareas para ver esta comparación.</p></div>` :
        `<ul class="lista-simple">${diffHoras.map(t=>`<li><div class="nombre">${escapeHTML(t.titulo)}</div><div style="text-align:right;"><div class="detalle">${t.estimadas}h est. / ${t.reales}h real</div><span class="pill ${t.dif>0?'vencido':'cobrado'}">${t.dif>0?'+':''}${t.dif}h</span></div></li>`).join('')}</ul>`}
      </div>
      <div class="panel">
        <h3>Registro de horas — ${MES_RENTABILIDAD}</h3>
        ${renderListaRegistroHoras()}
      </div>
    </div>
  `;

  document.getElementById('selectorMesRent').onchange = (e)=>{ MES_RENTABILIDAD = e.target.value; renderPagina(); };
  document.getElementById('btnCargarHoras').onclick = ()=>abrirFormHoras();
  root.querySelectorAll('[data-editar-hora]').forEach(b=>b.onclick=()=>abrirFormHoras(b.dataset.editarHora));
  root.querySelectorAll('[data-eliminar-hora]').forEach(b=>b.onclick=()=>{
    confirmarAccion('¿Eliminar este registro de horas?', ()=>{
      STATE.registroHoras = STATE.registroHoras.filter(x=>x.id!==b.dataset.eliminarHora);
      marcarCambio(renderPagina); toast('Registro eliminado','exito');
    });
  });

  const btnIniciar = document.getElementById('btnIniciarCrono');
  if(btnIniciar) btnIniciar.onclick = ()=>{
    const cliente = val('cr_cliente');
    if(!cliente){ toast('Elegí un cliente para iniciar el cronómetro','error'); return; }
    CRONOMETRO.activo = true; CRONOMETRO.inicioTS = Date.now(); CRONOMETRO.cliente = cliente; CRONOMETRO.tarea = val('cr_tarea');
    renderPagina();
    iniciarTickCronometro();
  };
  const btnDetener = document.getElementById('btnDetenerCrono');
  if(btnDetener) btnDetener.onclick = ()=>{
    const segundos = Math.round((Date.now()-CRONOMETRO.inicioTS)/1000);
    const horas = Math.round((segundos/3600)*100)/100;
    if(CRONOMETRO.intervalId) clearInterval(CRONOMETRO.intervalId);
    if(horas>0){
      STATE.registroHoras.push({id:uid('hor'), cliente:CRONOMETRO.cliente, tarea:CRONOMETRO.tarea, fecha:hoy(), horas, notas:'Registrado con cronómetro'});
      marcarCambio();
      toast(`Se registraron ${horas}h para ${CRONOMETRO.cliente}`,'exito');
    }
    CRONOMETRO = {activo:false, inicioTS:null, cliente:'', tarea:'', intervalId:null};
    renderPagina();
  };
  if(CRONOMETRO.activo) iniciarTickCronometro();
}
function iniciarTickCronometro(){
  if(CRONOMETRO.intervalId) clearInterval(CRONOMETRO.intervalId);
  const actualizar = ()=>{
    const el = document.getElementById('cronoTiempo');
    if(!el || !CRONOMETRO.activo){ if(CRONOMETRO.intervalId) clearInterval(CRONOMETRO.intervalId); return; }
    const segundos = Math.floor((Date.now()-CRONOMETRO.inicioTS)/1000);
    const h = String(Math.floor(segundos/3600)).padStart(2,'0');
    const m = String(Math.floor((segundos%3600)/60)).padStart(2,'0');
    const s = String(segundos%60).padStart(2,'0');
    el.textContent = `${h}:${m}:${s}`;
  };
  actualizar();
  CRONOMETRO.intervalId = setInterval(actualizar, 1000);
}
function renderListaRegistroHoras(){
  const lista = STATE.registroHoras.filter(h=>h.fecha && h.fecha.slice(0,7)===MES_RENTABILIDAD).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  if(lista.length===0) return `<div class="estado-vacio"><p>Sin horas registradas este mes.</p></div>`;
  return `<ul class="lista-simple">${lista.map(h=>`
    <li><div><div class="nombre">${escapeHTML(h.cliente)}</div><div class="detalle">${escapeHTML(h.tarea)||'—'} · ${fechaVista(h.fecha)}</div></div>
    <div style="display:flex; align-items:center; gap:8px;"><span>${h.horas}h</span>
    <button class="icon-btn" data-editar-hora="${h.id}" style="width:26px;height:26px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">${iconoSvg('edit')}</svg></button>
    <button class="icon-btn" data-eliminar-hora="${h.id}" style="width:26px;height:26px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">${iconoSvg('trash')}</svg></button></div></li>`).join('')}</ul>`;
}

        <div class="campo"><label>Costos fijos mensuales</label><input type="number" id="cfg_costosFijos" value="${STATE.config.costosFijos}"></div>
        <div class="campo"><label>Objetivo de rentabilidad (%)</label><input type="number" id="cfg_objetivoRentabilidad" value="${STATE.config.objetivoRentabilidad}"></div>
      </div>
      <button class="btn rosa chico" id="btnGuardarRentabilidad">Guardar</button>
    </div>

    <div class="subseccion">
      <h3>Presupuestos</h3>
      <div class="campo"><label>Métodos de pago</label><input id="cfg_metodosPago" value="${escapeHTML(STATE.config.metodosPago)}"></div>
      <div class="campo"><label>Condiciones predeterminadas</label><textarea id="cfg_condiciones">${escapeHTML(STATE.config.condicionesPresupuesto)}</textarea></div>
      <button class="btn rosa chico" id="btnGuardarPresuCfg">Guardar</button>
    </div>

    <div class="subseccion">
      <h3>Copias de seguridad</h3>
      <div class="pagina-acciones" style="margin-bottom:16px;">
        <button class="btn outline chico" id="btnCrearBackupManual">Crear copia manual</button>
        <button class="btn outline chico" id="btnExportarJSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;">${iconoSvg('download')}</svg> Exportar JSON</button>
        <input type="file" accept="application/json" id="inputImportarJSON" style="display:none;">
        <button class="btn outline chico" id="btnImportarJSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;">${iconoSvg('upload')}</svg> Importar JSON</button>
      </div>
      ${backups.length===0 ? `<p class="texto-gris" style="font-size:0.82rem;">Todavía no hay copias de seguridad guardadas.</p>` :
      backups.map((b,idx)=>`<div class="backup-item"><span>${b.fecha} · ${b.hora} <span class="pill pendiente">${b.motivo}</span></span><button class="btn outline chico" data-restaurar="${idx}">Restaurar</button></div>`).join('')}
    </div>

    <div class="subseccion">
      <h3>Zona de riesgo</h3>
      <div class="pagina-acciones">
        <button class="btn peligro chico" id="btnRestaurarEjemplo">Restaurar datos de ejemplo</button>
        <button class="btn peligro chico" id="btnEliminarTodo">Eliminar todos los datos</button>
      </div>
    </div>
  `;

  document.getElementById('btnGuardarDatosAgencia').onclick = ()=>{
    STATE.config.nombreAgencia = val('cfg_nombreAgencia'); STATE.config.responsable = val('cfg_responsable');
    STATE.config.correo = val('cfg_correo'); STATE.config.telefono = val('cfg_telefono');
    STATE.config.instagram = val('cfg_instagram'); STATE.config.sitioweb = val('cfg_sitioweb');
    marcarCambio(()=>{renderPagina(); renderSidebarLogo();}); toast('Datos de la agencia guardados','exito');
  };
  document.getElementById('btnGuardarRentabilidad').onclick = ()=>{
    STATE.config.valorHora = Number(val('cfg_valorHora'))||0; STATE.config.costosFijos = Number(val('cfg_costosFijos'))||0;
    STATE.config.objetivoRentabilidad = Number(val('cfg_objetivoRentabilidad'))||0;
    marcarCambio(); toast('Valores de rentabilidad guardados','exito');
  };
  document.getElementById('btnGuardarPresuCfg').onclick = ()=>{
    STATE.config.metodosPago = val('cfg_metodosPago'); STATE.config.condicionesPresupuesto = val('cfg_condiciones');
    marcarCambio(); toast('Configuración de presupuestos guardada','exito');
  };
  document.getElementById('btnSubirLogo').onclick = ()=>document.getElementById('inputLogo').click();
  document.getElementById('inputLogo').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      STATE.config.logoBase64 = ev.target.result;
      marcarCambio(()=>{renderPagina(); renderSidebarLogo();});
      toast('Logo cargado','exito');
    };
    reader.readAsDataURL(file);
  };
  const btnQuitar = document.getElementById('btnQuitarLogo');
  if(btnQuitar) btnQuitar.onclick = ()=>confirmarAccion('¿Eliminar el logo cargado?', ()=>{
    STATE.config.logoBase64=''; marcarCambio(()=>{renderPagina(); renderSidebarLogo();}); toast('Logo eliminado','exito');
  });

  document.getElementById('btnCrearBackupManual').onclick = ()=>{ crearBackup('manual'); toast('Copia de seguridad creada','exito'); renderPagina(); };
  document.getElementById('btnExportarJSON').onclick = ()=>{
    const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`trama-backup-${hoy()}.json`; a.click();
    URL.revokeObjectURL(url); STATE._ultimaExportacion = fechaHoraStr(); toast('Copia exportada en JSON','exito');
  };
  document.getElementById('btnImportarJSON').onclick = ()=>document.getElementById('inputImportarJSON').click();
  document.getElementById('inputImportarJSON').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data || typeof data!=='object' || !data.clientes || !data.config){
          toast('El archivo no tiene una estructura válida','error'); return;
        }
        confirmarAccion('¿Reemplazar todos los datos actuales por los del archivo importado?', ()=>{
          crearBackup('antes de importar');
          STATE = data; marcarCambio(()=>{renderPagina(); renderSidebarLogo();}); toast('Datos importados correctamente','exito');
        });
      }catch(err){ toast('Error al leer el archivo JSON','error'); }
    };
    reader.readAsText(file);
  };
  root.querySelectorAll('[data-restaurar]').forEach(b=>b.onclick=()=>{
    confirmarAccion('¿Restaurar esta copia de seguridad? Se reemplazarán los datos actuales.', ()=>{
      const backupsAhora = JSON.parse(localStorage.getItem(LS_BACKUPS)||'[]');
      const bk = backupsAhora[Number(b.dataset.restaurar)];
      if(bk){ STATE = bk.data; marcarCambio(()=>{renderPagina(); renderSidebarLogo();}); toast('Copia restaurada','exito'); }
    });
  });
  document.getElementById('btnRestaurarEjemplo').onclick = ()=>{
    confirmarAccion('¿Restaurar los datos de ejemplo? Se perderá la información actual no respaldada.', ()=>{
      crearBackup('antes de restaurar ejemplo');
      STATE = datosDeEjemplo(); marcarCambio(()=>{renderPagina(); renderSidebarLogo();}); toast('Datos de ejemplo restaurados','exito');
    });
  };
  document.getElementById('btnEliminarTodo').onclick = ()=>{
    confirmarAccion('¿Eliminar TODOS los datos de la aplicación? Esta acción no se puede deshacer.', ()=>{
      crearBackup('antes de eliminar todo');
      STATE = datosDeEjemplo();
      STATE.clientes=[]; STATE.oportunidades=[]; STATE.ingresos=[]; STATE.gastos=[]; STATE.presupuestos=[]; STATE.tareas=[];
      marcarCambio(()=>{renderPagina(); renderSidebarLogo();}); toast('Todos los datos fueron eliminados','exito');
    });
  };
}

function renderSidebarLogo(){
  const el = document.getElementById('logoMarkSidebar');
  const cont = document.getElementById('sidebarLogo');
  if(STATE.config.logoBase64){
    cont.innerHTML = `<img src="${STATE.config.logoBase64}" class="logo-img" id="logoMarkSidebar">`;
  } else {
    cont.innerHTML = `<span class="logo-mark" id="logoMarkSidebar"><span class="t1">trama</span><span class="t2">studio</span></span>`;
  }
}

/* ---------------------------------------------------------------------
   14. BOTÓN "NUEVO" (accesos rápidos del header)
--------------------------------------------------------------------- */
function renderDropdownNuevo(){
  const opciones = [
    {label:'Cliente', fn:()=>abrirFormCliente()},
    {label:'Oportunidad', fn:()=>abrirFormOportunidad()},
    {label:'Ingreso', fn:()=>abrirFormIngreso()},
    {label:'Gasto', fn:()=>abrirFormGasto()},
    {label:'Presupuesto', fn:()=>abrirFormPresupuesto()},
    {label:'Tarea', fn:()=>abrirFormTarea()},
    {label:'Evento', fn:()=>abrirFormEvento()},
    {label:'Servicio', fn:()=>abrirFormServicio()},
    {label:'Producción', fn:()=>abrirFormProduccion()},
    {label:'Contenido', fn:()=>abrirFormContenido()},
    {label:'Registro de horas', fn:()=>abrirFormHoras()},
  ];
  const dd = document.getElementById('dropdownNuevo');
  dd.innerHTML = opciones.map((o,i)=>`<button data-op="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('plus')}</svg>${o.label}</button>`).join('');
  dd.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{ dd.classList.remove('abierto'); opciones[i].fn(); });
}
document.getElementById('btnNuevo').addEventListener('click', (e)=>{
  e.stopPropagation();
  document.getElementById('dropdownNuevo').classList.toggle('abierto');
});
document.addEventListener('click', ()=>document.getElementById('dropdownNuevo').classList.remove('abierto'));

/* ---------------------------------------------------------------------
   15. BUSCADOR GLOBAL
--------------------------------------------------------------------- */
document.getElementById('buscadorGlobal').addEventListener('keydown', (e)=>{
  if(e.key!=='Enter') return;
  const t = e.target.value.trim().toLowerCase();
  if(!t) return;
  const cliente = STATE.clientes.find(c=>c.marca.toLowerCase().includes(t));
  if(cliente){ irASeccion('clientes'); setTimeout(()=>abrirFichaCliente(cliente.id), 80); return; }
  const tarea = STATE.tareas.find(x=>x.titulo.toLowerCase().includes(t));
  if(tarea){ irASeccion('tareas'); return; }
  const presu = STATE.presupuestos.find(p=>p.cliente.toLowerCase().includes(t));
  if(presu){ irASeccion('presupuestos'); return; }
  toast('Sin resultados para "'+e.target.value+'"');
});

/* ---------------------------------------------------------------------
   16. MENÚ LATERAL / RESPONSIVE
--------------------------------------------------------------------- */
document.getElementById('btnColapsar').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('colapsada');
});
document.getElementById('btnMenuMobile').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.add('abierta');
  document.getElementById('fondoMobile').classList.add('activo');
});
document.getElementById('fondoMobile').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('abierta');
  document.getElementById('fondoMobile').classList.remove('activo');
});

/* ---------------------------------------------------------------------
   17. GUARDADO MANUAL
--------------------------------------------------------------------- */
document.getElementById('btnGuardarManual').addEventListener('click', ()=>{
  guardarEstadoReal(true);
  toast('Todos los cambios fueron guardados correctamente.', 'exito');
});

/* ---------------------------------------------------------------------
   18. INICIALIZACIÓN
--------------------------------------------------------------------- */
function iniciar(){
  try{
    cargarEstado();
    document.getElementById('fechaActual').textContent = new Date().toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
    renderSidebarLogo();
    renderMenu();
    renderDropdownNuevo();
    renderPagina();
    guardarEstadoReal(false);
    // Autoguardado periódico de seguridad cada 60s si hay cambios en memoria distintos a lo guardado
    setInterval(()=>{ if(CAMBIOS_PENDIENTES) guardarEstadoReal(false); }, 60000);
  }catch(err){
    console.error('Error al iniciar la aplicación', err);
    const detalle = escapeHTML((err && err.message) || String(err));
    document.getElementById('app').innerHTML = `<div style="padding:60px 30px; max-width:520px; margin:0 auto; text-align:center; font-family:Raleway, sans-serif;">
      <h1 style="font-family:'Times New Roman',serif; font-size:1.6rem; margin-bottom:14px;">No se pudo iniciar el panel</h1>
      <p style="color:#8a8580; font-size:0.9rem;">Probá recargar la página. Si el problema persiste, mandá una captura de este detalle:</p>
      <p style="margin-top:14px; font-size:0.7rem; color:#a1352d; font-family:monospace; word-break:break-word;">${detalle}</p>
    </div>`;
  }
}
iniciar();
</script>
</body>
</html>
