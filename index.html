<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAMA Studio — Panel de gestión</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
/* =========================================================
   TRAMA STUDIO — Identidad visual
   Negro profundo / blanco cálido / rosa pastel / grises
   Times New Roman (editorial) + Raleway (funcional) + script (decorativo)
========================================================= */
:root{
  --negro:#0a0a0a;
  --negro-suave:#141414;
  --blanco:#fdfcfb;
  --blanco-puro:#ffffff;
  --rosa:#f6cfd6;
  --rosa-fuerte:#ecb6c1;
  --rosa-suave:#fbe8ec;
  --gris:#8a8580;
  --gris-claro:#e8e5e1;
  --gris-linea:#e2ddd8;
  --texto:#1c1a19;
  --editorial:'Times New Roman', 'Playfair Display', Georgia, serif;
  --funcional:'Raleway', sans-serif;
  --script:'Mrs Saint Delafield', cursive;
  --radio:2px;
  --sombra:0 1px 3px rgba(0,0,0,0.06);
  --transicion:180ms ease;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--funcional);
  color:var(--texto);
  background:var(--blanco);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  letter-spacing:0.01em;
}
h1,h2,h3,.editorial{font-family:var(--editorial); font-weight:400; letter-spacing:0;}
.script{font-family:var(--script); font-weight:400; letter-spacing:0.02em;}
button{font-family:var(--funcional); cursor:pointer;}
input,select,textarea{font-family:var(--funcional);}
a{color:inherit;}
::selection{background:var(--rosa); color:var(--negro);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--gris-claro); border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--gris);}

/* ---------- Layout general ---------- */
#app{display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:236px; flex-shrink:0; background:var(--negro); color:var(--blanco-puro);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  transition:width var(--transicion);
  z-index:40;
}
.sidebar.colapsada{width:72px;}
.sidebar-logo{
  padding:28px 22px 22px 22px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,0.08);
  min-height:76px;
}
.logo-mark{display:flex; align-items:baseline; gap:2px; font-size:1.5rem; white-space:nowrap; overflow:hidden;}
.logo-mark .t1{font-family:var(--editorial); font-style:italic; color:#fff;}
.logo-mark .t2{font-family:var(--funcional); font-weight:700; color:var(--rosa); font-size:0.92em;}
.logo-img{max-height:34px; max-width:170px; object-fit:contain;}
.sidebar.colapsada .logo-mark span:not(.t1){display:none;}
.sidebar.colapsada .logo-mark{font-size:1.3rem;}

.sidebar-toggle{
  background:none; border:none; color:var(--gris); padding:10px 22px; text-align:left; font-size:0.72rem;
  letter-spacing:0.08em; text-transform:uppercase; display:flex; align-items:center; gap:8px;
}
.sidebar-toggle:hover{color:#fff;}

nav.menu{flex:1; overflow-y:auto; padding:8px 0 16px 0;}
.menu-item{
  display:flex; align-items:center; gap:13px; padding:11px 22px; color:rgba(255,255,255,0.62);
  font-size:0.86rem; letter-spacing:0.015em; border-left:2px solid transparent; transition:all var(--transicion);
  white-space:nowrap; overflow:hidden;
}
.menu-item svg{width:17px; height:17px; flex-shrink:0;}
.menu-item:hover{color:#fff; background:rgba(255,255,255,0.04);}
.menu-item.activo{color:#fff; border-left-color:var(--rosa); background:rgba(246,207,214,0.08);}
.sidebar.colapsada .menu-item span.label{display:none;}
.sidebar.colapsada .menu-item{justify-content:center; padding:11px 0;}

.sidebar-footer{padding:16px 22px; border-top:1px solid rgba(255,255,255,0.08); font-size:0.7rem; color:var(--gris);}
.sidebar.colapsada .sidebar-footer{display:none;}

/* ---------- Contenido ---------- */
.contenido{flex:1; min-width:0; display:flex; flex-direction:column;}

/* ---------- Header ---------- */
.topbar{
  background:var(--blanco-puro); border-bottom:1px solid var(--gris-linea); padding:14px 32px;
  display:flex; align-items:center; gap:18px; position:sticky; top:0; z-index:30; flex-wrap:wrap;
}
.topbar .fecha-actual{font-size:0.78rem; color:var(--gris); white-space:nowrap;}
.buscador-global{
  flex:1; min-width:160px; max-width:340px; position:relative;
}
.buscador-global input{
  width:100%; padding:8px 12px 8px 34px; border:1px solid var(--gris-linea); border-radius:var(--radio);
  font-size:0.82rem; background:var(--blanco);
}
.buscador-global input:focus{outline:none; border-color:var(--rosa-fuerte);}
.buscador-global svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--gris);}
.estado-guardado{font-size:0.72rem; color:var(--gris); display:flex; align-items:center; gap:6px; white-space:nowrap;}
.estado-guardado .punto{width:6px; height:6px; border-radius:50%; background:#7ea87e;}
.estado-guardado.guardando .punto{background:var(--rosa-fuerte); animation:pulso 1s infinite;}
.estado-guardado.error .punto{background:#c0524a;}
.estado-guardado.pendiente .punto{background:#c9899a;}
@keyframes pulso{0%,100%{opacity:1;}50%{opacity:0.3;}}

.btn{
  border:1px solid var(--negro); background:var(--negro); color:#fff; padding:8px 16px; border-radius:var(--radio);
  font-size:0.78rem; letter-spacing:0.02em; display:inline-flex; align-items:center; gap:6px; transition:all var(--transicion);
  white-space:nowrap;
}
.btn:hover{background:#000; opacity:0.85;}
.btn svg{width:14px; height:14px;}
.btn.rosa{background:var(--rosa); border-color:var(--rosa); color:var(--negro);}
.btn.rosa:hover{background:var(--rosa-fuerte);}
.btn.outline{background:transparent; color:var(--negro); border-color:var(--negro);}
.btn.outline:hover{background:var(--negro); color:#fff;}
.btn.chico{padding:5px 11px; font-size:0.72rem;}
.btn.peligro{background:transparent; color:#a83e37; border-color:#a83e37;}
.btn.peligro:hover{background:#a83e37; color:#fff;}
.btn:disabled{opacity:0.4; cursor:not-allowed;}
.icon-btn{
  width:34px; height:34px; border-radius:var(--radio); border:1px solid var(--gris-linea); background:#fff;
  display:flex; align-items:center; justify-content:center; color:var(--texto); position:relative; flex-shrink:0;
}
.icon-btn:hover{border-color:var(--rosa-fuerte); background:var(--rosa-suave);}
.icon-btn svg{width:16px; height:16px;}

.menu-nuevo{position:relative;}
.dropdown-nuevo{
  position:absolute; right:0; top:calc(100% + 8px); background:#fff; border:1px solid var(--gris-linea);
  border-radius:var(--radio); box-shadow:0 8px 24px rgba(0,0,0,0.12); min-width:200px; z-index:100; display:none; overflow:hidden;
}
.dropdown-nuevo.abierto{display:block;}
.dropdown-nuevo button{
  width:100%; text-align:left; padding:10px 16px; background:none; border:none; font-size:0.8rem; display:flex; align-items:center; gap:9px;
}
.dropdown-nuevo button:hover{background:var(--rosa-suave);}
.dropdown-nuevo button svg{width:14px; height:14px; color:var(--gris);}

/* ---------- Zona de página ---------- */
.pagina{padding:30px 32px 60px 32px; max-width:1360px; width:100%;}
.pagina-header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
.pagina-header h1{font-size:2rem; font-weight:400;}
.pagina-header .sub{color:var(--gris); font-size:0.85rem; margin-top:4px;}
.pagina-acciones{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

.saludo-inicio{margin-bottom:32px;}
.saludo-inicio h1{font-size:2.4rem; font-style:italic;}
.saludo-inicio p{color:var(--gris); margin-top:6px; font-size:0.92rem;}

/* ---------- Grid de tarjetas ---------- */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-bottom:30px;}
.card{
  background:#fff; border:1px solid var(--gris-linea); border-radius:var(--radio); padding:18px 18px 16px 18px;
  box-shadow:var(--sombra);
}
.card .etiqueta{font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--gris); margin-bottom:8px;}
.card .valor{font-family:var(--editorial); font-size:1.7rem;}
.card .valor.rosa-texto{color:#c9899a;}
.card .delta{font-size:0.72rem; margin-top:6px; color:var(--gris);}
.card.negro{background:var(--negro); color:#fff; border-color:var(--negro);}
.card.negro .etiqueta{color:rgba(255,255,255,0.55);}
.card.acento{border-color:var(--rosa-fuerte); background:var(--rosa-suave);}

.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:28px;}
.grid-2.grid-cal{grid-template-columns:2.4fr 1fr;}
.grid-3col{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:1000px){.grid-2{grid-template-columns:1fr;} .grid-2.grid-cal{grid-template-columns:1fr;} .grid-3col{grid-template-columns:1fr;}}

.panel{background:#fff; border:1px solid var(--gris-linea); border-radius:var(--radio); padding:20px 22px; box-shadow:var(--sombra);}
.panel h3{font-size:1.05rem; margin-bottom:14px; font-weight:400;}
.panel h3 .script{font-size:1.3em; color:var(--gris);}

.lista-simple{display:flex; flex-direction:column; gap:0;}
.lista-simple li, .fila-lista{
  display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--gris-linea);
  font-size:0.83rem; gap:10px; list-style:none;
}
.lista-simple li:last-child, .fila-lista:last-child{border-bottom:none;}
.fila-lista .nombre{font-weight:500;}
.fila-lista .detalle{color:var(--gris); font-size:0.76rem;}
.pill{font-size:0.66rem; padding:3px 9px; border-radius:20px; letter-spacing:0.03em; white-space:nowrap; text-transform:uppercase; font-weight:600;}
.pill.vencido{background:#f6d9d6; color:#a1352d;}
.pill.pendiente{background:var(--gris-claro); color:#6b665f;}
.pill.cobrado, .pill.activo, .pill.aprobado, .pill.finalizada, .pill.ganado{background:#dcebd9; color:#4d7a48;}
.pill.parcial, .pill.enviado, .pill.enproceso{background:var(--rosa); color:#8a4f5c;}
.pill.pausado, .pill.borrador{background:var(--gris-claro); color:#6b665f;}
.pill.potencial, .pill.retomar{background:#efe4d0; color:#8a6a2f;}
.pill.rechazado, .pill.noInteresado{background:#f0e4e4; color:#8a3f3f;}
.pill.alta,.pill.urgente{background:#f6d9d6; color:#a1352d;}
.pill.media{background:#faeed0; color:#8a6a2f;}
.pill.baja{background:#dcebd9; color:#4d7a48;}

.estado-vacio{
  text-align:center; padding:40px 20px; color:var(--gris);
}
.estado-vacio .icono{margin-bottom:10px; opacity:0.4;}
.estado-vacio p{font-size:0.85rem;}
.estado-vacio .script{display:block; font-size:1.6rem; color:var(--rosa-fuerte); margin-bottom:6px;}

/* ---------- Filtros / toolbar ---------- */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px;}
.toolbar input[type=text], .toolbar input[type=search]{
  padding:8px 12px; border:1px solid var(--gris-linea); border-radius:var(--radio); font-size:0.8rem; min-width:180px;
}
.toolbar select{padding:8px 10px; border:1px solid var(--gris-linea); border-radius:var(--radio); font-size:0.8rem; background:#fff;}
.toolbar input:focus, .toolbar select:focus{outline:none; border-color:var(--rosa-fuerte);}
.vista-toggle{display:flex; border:1px solid var(--gris-linea); border-radius:var(--radio); overflow:hidden; margin-left:auto;}
.vista-toggle button{padding:7px 13px; background:#fff; border:none; font-size:0.75rem; color:var(--gris); border-right:1px solid var(--gris-linea);}
.vista-toggle button:last-child{border-right:none;}
.vista-toggle button.activo{background:var(--negro); color:#fff;}

/* ---------- Tablas ---------- */
.tabla-wrap{overflow-x:auto; border:1px solid var(--gris-linea); border-radius:var(--radio); background:#fff;}
table{width:100%; border-collapse:collapse; font-size:0.82rem;}
thead th{
  text-align:left; padding:11px 14px; background:var(--negro); color:#fff; font-weight:500; font-size:0.7rem;
  text-transform:uppercase; letter-spacing:0.06em; white-space:nowrap; cursor:pointer; user-select:none;
}
thead th:hover{color:var(--rosa);}
tbody td{padding:11px 14px; border-bottom:1px solid var(--gris-linea); vertical-align:middle;}
tbody tr:hover{background:var(--rosa-suave);}
tbody tr:last-child td{border-bottom:none;}
.acciones-fila{display:flex; gap:6px;}
.acciones-fila button{
  border:none; background:none; padding:4px; color:var(--gris); border-radius:var(--radio);
}
.acciones-fila button:hover{color:var(--negro); background:var(--gris-claro);}
.acciones-fila svg{width:15px; height:15px;}

/* ---------- Kanban ---------- */
.kanban{display:flex; gap:14px; overflow-x:auto; padding-bottom:14px;}
.kanban-col{
  background:var(--rosa-suave); border-radius:var(--radio); min-width:250px; width:250px; flex-shrink:0; padding:12px;
  display:flex; flex-direction:column; max-height:74vh;
}
.kanban-col h4{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--gris); margin-bottom:10px; display:flex; justify-content:space-between;}
.kanban-cards{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px;}
.kanban-card{
  background:#fff; border:1px solid var(--gris-linea); border-radius:var(--radio); padding:11px 12px; font-size:0.78rem;
  cursor:grab; box-shadow:var(--sombra);
}
.kanban-card:active{cursor:grabbing;}
.kanban-card.arrastrando{opacity:0.4;}
.kanban-card .titulo-card{font-weight:600; margin-bottom:4px;}
.kanban-card .meta-card{color:var(--gris); font-size:0.72rem; display:flex; justify-content:space-between; margin-top:6px;}
.kanban-col.sobre{outline:2px dashed var(--rosa-fuerte);}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(10,10,10,0.55); display:none; align-items:flex-start; justify-content:center;
  z-index:200; padding:40px 16px; overflow-y:auto;
}
.overlay.abierto{display:flex;}
.modal{
  background:#fff; width:100%; max-width:640px; border-radius:var(--radio); box-shadow:0 20px 60px rgba(0,0,0,0.3);
  animation:aparecer 160ms ease;
}
.modal.ancho{max-width:920px;}
@keyframes aparecer{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}
.modal-header{display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--gris-linea);}
.modal-header h2{font-size:1.25rem; font-weight:400;}
.modal-cerrar{background:none; border:none; color:var(--gris); padding:4px;}
.modal-cerrar:hover{color:var(--negro);}
.modal-body{padding:22px 24px; max-height:70vh; overflow-y:auto;}
.modal-footer{padding:16px 24px; border-top:1px solid var(--gris-linea); display:flex; justify-content:flex-end; gap:10px;}

.campo{margin-bottom:15px;}
.campo label{display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--gris); margin-bottom:6px;}
.campo label .req{color:#a1352d;}
.campo input, .campo select, .campo textarea{
  width:100%; padding:9px 12px; border:1px solid var(--gris-linea); border-radius:var(--radio); font-size:0.85rem; background:#fff;
}
.campo input:focus, .campo select:focus, .campo textarea:focus{outline:none; border-color:var(--rosa-fuerte); background:#fff;}
.campo textarea{resize:vertical; min-height:70px;}
.campo.error input, .campo.error select, .campo.error textarea{border-color:#a1352d;}
.campo .msg-error{color:#a1352d; font-size:0.7rem; margin-top:4px; display:none;}
.campo.error .msg-error{display:block;}
.fila-campos{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.fila-campos.tres{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:600px){.fila-campos, .fila-campos.tres{grid-template-columns:1fr;}}

/* ---------- Toast ---------- */
.toasts{position:fixed; bottom:22px; right:22px; z-index:400; display:flex; flex-direction:column; gap:10px; max-width:320px;}
.toast{
  background:var(--negro); color:#fff; padding:13px 18px; border-radius:var(--radio); font-size:0.8rem; box-shadow:0 8px 24px rgba(0,0,0,0.25);
  display:flex; align-items:center; gap:10px; animation:entrar-toast 220ms ease;
  border-left:3px solid var(--rosa);
}
.toast.exito{border-left-color:#7ea87e;}
.toast.error{border-left-color:#c0524a;}
@keyframes entrar-toast{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);}}

/* ---------- Ficha lateral cliente ---------- */
.ficha-tabs{display:flex; gap:2px; border-bottom:1px solid var(--gris-linea); margin-bottom:16px; flex-wrap:wrap;}
.ficha-tabs button{padding:9px 14px; background:none; border:none; font-size:0.76rem; color:var(--gris); border-bottom:2px solid transparent;}
.ficha-tabs button.activo{color:var(--negro); border-bottom-color:var(--rosa-fuerte); font-weight:600;}

/* ---------- Presupuesto imprimible ---------- */
.hoja-presupuesto{background:#fff; padding:40px; border:1px solid var(--gris-linea);}
.hoja-presupuesto .logo-presu{margin-bottom:30px;}
.hoja-presupuesto table{margin:18px 0;}
.hoja-presupuesto thead th{background:var(--negro);}
.total-final{text-align:right; font-family:var(--editorial); font-size:1.5rem; margin-top:10px;}

/* ---------- Config ---------- */
.subseccion{margin-bottom:34px;}
.subseccion h3{font-size:1.05rem; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--gris-linea);}
.logo-preview{
  width:220px; height:90px; background:var(--negro); border-radius:var(--radio); display:flex; align-items:center; justify-content:center;
  margin-bottom:12px; overflow:hidden;
}
.logo-preview img{max-width:90%; max-height:80%; object-fit:contain;}
.backup-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--gris-linea); font-size:0.8rem;}
.backup-item:last-child{border-bottom:none;}

/* ---------- Toggle menu mobile ---------- */
.menu-mobile-btn{display:none; background:none; border:none; padding:6px;}
@media(max-width:880px){
  .sidebar{position:fixed; left:-236px; top:0; height:100vh; transition:left var(--transicion);}
  .sidebar.abierta{left:0;}
  .sidebar.colapsada{width:236px;}
  .menu-mobile-btn{display:flex;}
  .contenido{width:100%;}
  .pagina{padding:20px 16px 50px 16px;}
  .grid-2{grid-template-columns:1fr;}
  .topbar{padding:12px 16px;}
  .topbar .fecha-actual{display:none;}
}
.fondo-mobile{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:35;}
.fondo-mobile.activo{display:block;}

.checklist-item{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:0.82rem;}

/* ---------- Calendario ---------- */
.cal-grid-header{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
.cal-grid-header div{text-align:center; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--gris);}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-celda{
  min-height:84px; border:1px solid var(--gris-linea); border-radius:var(--radio); padding:6px; cursor:pointer;
  display:flex; flex-direction:column; background:#fff; transition:background var(--transicion);
}
.cal-celda:hover{background:var(--rosa-suave);}
.cal-celda.vacia{border:none; cursor:default; background:transparent;}
.cal-celda.hoy{border-color:var(--rosa-fuerte); background:var(--rosa-suave);}
.cal-num{font-size:0.75rem; font-weight:600; margin-bottom:4px;}
.cal-eventos{display:flex; flex-direction:column; gap:3px; overflow:hidden;}
.cal-evento{
  font-size:0.62rem; color:#fff; padding:2px 5px; border-radius:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cal-mas{font-size:0.6rem; color:var(--gris);}
.cal-semana{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-col-semana{border:1px solid var(--gris-linea); border-radius:var(--radio); padding:8px; min-height:160px;}
.cal-col-semana.hoy{border-color:var(--rosa-fuerte); background:var(--rosa-suave);}

   Aplicación de una sola página, pensada para abrir directamente en el navegador.
   Sin autoguardado: los datos viven en memoria mientras la pestaña está abierta.
   El respaldo es manual, exportando/importando un archivo JSON.
========================================================================= */

/* ---------------------------------------------------------------------
   1. UTILIDADES GENERALES
--------------------------------------------------------------------- */
function descargarJSON(data, nombreArchivo){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nombreArchivo; a.click();
  URL.revokeObjectURL(url);
}

function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function hoy(){ return new Date().toISOString().slice(0,10); }
function fechaHoraStr(){
  const d = new Date();
  return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
}
function fechaVista(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return `${d}/${m}/${y}`;
}
function moneda(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-AR',{minimumFractionDigits:0, maximumFractionDigits:0});
}
function escapeHTML(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function diasEntre(iso){
  if(!iso) return null;
  const hoyD = new Date(hoy()); const otro = new Date(iso);
  return Math.round((otro - hoyD)/86400000);
}
function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}

const LS_KEY = 'trama_data_v1';
const LS_BACKUPS = 'trama_backups_v1';
const MAX_BACKUPS = 5;

let STATE = null;
let CAMBIOS_PENDIENTES = false;

function cargarEstado(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    STATE = raw ? JSON.parse(raw) : datosDeEjemplo();
  }catch(e){
    console.error('Error al leer localStorage, se usan datos de ejemplo.', e);
    STATE = datosDeEjemplo();
  }
  const base = datosDeEjemplo();
  for(const k of Object.keys(base)){ if(STATE[k]===undefined) STATE[k]=base[k]; }
  for(const k of Object.keys(base.config)){ if(STATE.config[k]===undefined) STATE.config[k]=base.config[k]; }
}

function crearBackup(motivo){
  try{
    let backups = JSON.parse(localStorage.getItem(LS_BACKUPS) || '[]');
    backups.unshift({fecha:hoy(), hora:new Date().toLocaleTimeString('es-AR'), motivo, data:JSON.parse(JSON.stringify(STATE))});
    backups = backups.slice(0, MAX_BACKUPS);
    localStorage.setItem(LS_BACKUPS, JSON.stringify(backups));
  }catch(e){ console.error('No se pudo crear copia de seguridad', e); }
}

    localStorage.setItem(LS_KEY, JSON.stringify(STATE));
    const ahora = Date.now();
    if(manual || (ahora - ultimoBackupTS) > 120000){
      crearBackup(manual ? 'manual' : 'automático');
      ultimoBackupTS = ahora;
    }
    CAMBIOS_PENDIENTES = false;
    const hora = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    setTimeout(()=>{
      el.className = 'estado-guardado';
      txt.textContent = 'Todos los cambios fueron guardados · ' + hora;
    }, 300);
  }catch(e){
    console.error('Error al guardar', e);
    el.className = 'estado-guardado error';
    txt.textContent = 'Error al guardar (¿modo privado del navegador?)';
  }
}
const guardarDebounced = debounce(()=>guardarEstadoReal(false), 650);

function marcarCambio(rerenderFn){
  CAMBIOS_PENDIENTES = true;
  guardarDebounced();
  if(typeof rerenderFn === 'function') rerenderFn();
}

function exportarRespaldo(manual){
  descargarJSON(STATE, `trama-respaldo-${hoy()}.json`);
  if(manual) toast('Respaldo descargado. Guardalo en un lugar seguro (Drive, Archivos, etc.).', 'exito');
}

window.addEventListener('beforeunload', (e)=>{
  if(CAMBIOS_PENDIENTES){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

--------------------------------------------------------------------- */
function toast(msg, tipo){
  const cont = document.getElementById('toasts');
  const div = document.createElement('div');
  div.className = 'toast ' + (tipo||'');
  div.textContent = msg;
  cont.appendChild(div);
  setTimeout(()=>{ div.style.opacity='0'; div.style.transition='opacity 300ms'; setTimeout(()=>div.remove(),300); }, 3200);
}

  SECCION_ACTUAL = id;

  document.getElementById('sidebar').classList.remove('abierta');
  document.getElementById('fondoMobile').classList.remove('activo');

function renderPagina(){
  const p = document.getElementById('pagina');
  const renderers = {
    inicio: renderInicio,
    clientes: renderClientes,
    oportunidades: renderOportunidades,
    finanzas: renderFinanzas,

    contenido: renderContenido,
    metricas: renderMetricas,

  p.innerHTML = '';

    p.innerHTML = `<div class="estado-vacio"><span class="script">Ups, algo no cargó bien</span><p>Hubo un problema al mostrar esta sección. Probá tocar otra sección del menú o recargar la página. Tus datos guardados no se ven afectados.</p>

function abrirModal({titulo, cuerpoHTML, ancho, footerHTML, onAbrir}){

  abrirModal({
    titulo:'Confirmar acción',
    cuerpoHTML:`<p style="font-size:0.9rem;">${escapeHTML(mensaje)}</p>`,
    footerHTML:`<button class="btn outline" id="btnCancelarConf">Cancelar</button><button class="btn peligro" id="btnConfirmarConf">Confirmar</button>`,

}

   6. INICIO
--------------------------------------------------------------------- */
let MES_INICIO = new Date().toISOString().slice(0,7);

function renderInicio(root){
  const [anio, mes] = MES_INICIO.split('-');
  const ingresosDelMes = STATE.ingresos.filter(i=>i.mes===MES_INICIO);
  const totalIngresos = ingresosDelMes.reduce((a,i)=>a+Number(i.importe||0),0);
  const cobrado = ingresosDelMes.filter(i=>i.estado==='cobrado').reduce((a,i)=>a+Number(i.importe||0),0);
  const pendienteCobro = ingresosDelMes.filter(i=>i.estado==='pendiente'||i.estado==='parcial').reduce((a,i)=>a+Number(i.importe||0),0);
  const vencido = STATE.ingresos.filter(i=>i.estado==='vencido').reduce((a,i)=>a+Number(i.importe||0),0);
  const gastosDelMes = STATE.gastos.filter(g=>g.fecha && g.fecha.slice(0,7)===MES_INICIO);
  const totalGastos = gastosDelMes.reduce((a,g)=>a+Number(g.importe||0),0);
  const gananciaNeta = totalIngresos - totalGastos;

  const clientesActivos = STATE.clientes.filter(c=>c.estado==='activo').length;
  const potenciales = STATE.oportunidades.filter(o=>!['ganado','no_interesado'].includes(o.estado)).length;
  const presuEnviados = STATE.presupuestos.filter(p=>p.estado==='enviado').length;
  const presuAprobados = STATE.presupuestos.filter(p=>p.estado==='aprobado').length;
  const tareasPendientes = STATE.tareas.filter(t=>t.estado!=='finalizada').length;
  const tareasVencidas = STATE.tareas.filter(t=>t.estado!=='finalizada' && diasEntre(t.fechaEntrega)<0).length;
  const pagosVencidosArr = STATE.ingresos.filter(i=>i.estado==='vencido');

  const opciones = [];
  const hoyD = new Date();
  for(let i=-3;i<=2;i++){
    const d = new Date(hoyD.getFullYear(), hoyD.getMonth()+i, 1);
    const val = d.toISOString().slice(0,7);
    opciones.push(`<option value="${val}" ${val===MES_INICIO?'selected':''}>${d.toLocaleDateString('es-AR',{month:'long', year:'numeric'})}</option>`);
  }

  root.innerHTML = `
    <div class="saludo-inicio">
      <h1>Hola, ${escapeHTML(STATE.config.responsable||'Ori')}.</h1>
      <p>${new Date().toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'long', year:'numeric'})}</p>
    </div>

    <div class="toolbar" style="margin-bottom:20px;">
      <label class="texto-gris" style="font-size:0.78rem;">Ver mes:</label>
      <select id="selectorMes">${opciones.join('')}</select>
    </div>

    <div class="grid-cards">
      <div class="card negro"><div class="etiqueta">Ingresos del mes</div><div class="valor">${moneda(totalIngresos)}</div></div>
      <div class="card"><div class="etiqueta">Gastos del mes</div><div class="valor">${moneda(totalGastos)}</div></div>
      <div class="card acento"><div class="etiqueta">Ganancia neta</div><div class="valor rosa-texto">${moneda(gananciaNeta)}</div></div>
      <div class="card"><div class="etiqueta">Pendiente de cobro</div><div class="valor">${moneda(pendienteCobro)}</div></div>
      <div class="card"><div class="etiqueta">Pagos vencidos</div><div class="valor" style="color:#a1352d;">${moneda(vencido)}</div></div>
      <div class="card"><div class="etiqueta">Clientes activos</div><div class="valor">${clientesActivos}</div></div>
      <div class="card"><div class="etiqueta">Oportunidades activas</div><div class="valor">${potenciales}</div></div>
      <div class="card"><div class="etiqueta">Presupuestos enviados</div><div class="valor">${presuEnviados}</div></div>
      <div class="card"><div class="etiqueta">Presupuestos aprobados</div><div class="valor">${presuAprobados}</div></div>
      <div class="card"><div class="etiqueta">Tareas pendientes</div><div class="valor">${tareasPendientes}</div></div>
      <div class="card"><div class="etiqueta">Tareas vencidas</div><div class="valor" style="color:${tareasVencidas>0?'#a1352d':'inherit'};">${tareasVencidas}</div></div>
      <div class="card"><div class="etiqueta">Total cobrado</div><div class="valor">${moneda(cobrado)}</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h3>Ingresos y gastos <span class="script">— visión mensual</span></h3>
        <canvas id="chartIngresosGastos" height="230"></canvas>
      </div>
      <div class="panel">
        <h3>Facturación por cliente</h3>
        <canvas id="chartFacturacionCliente" height="230"></canvas>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h3>Pagos pendientes y vencidos</h3>
        ${renderListaPagosPendientes()}
      </div>
      <div class="panel">
        <h3>Tareas prioritarias</h3>
        ${renderListaTareasPrioritarias()}
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h3>Seguimientos comerciales pendientes</h3>
        ${renderListaSeguimientos()}
      </div>
      <div class="panel">
        <h3>Ingresos por servicio</h3>
        <canvas id="chartServicio" height="230"></canvas>
      </div>
    </div>
  `;

  document.getElementById('selectorMes').addEventListener('change', (e)=>{ MES_INICIO = e.target.value; renderPagina(); });

  // ---- Gráficos ----
  setTimeout(()=>{
    if(typeof Chart === 'undefined'){
      document.querySelectorAll('#chartIngresosGastos, #chartFacturacionCliente, #chartServicio').forEach(c=>{
        c.insertAdjacentHTML('afterend', '<p class="texto-gris" style="font-size:0.75rem;">Los gráficos necesitan conexión a internet para cargar. Los datos siguen disponibles en las tarjetas y listas.</p>');
        c.style.display = 'none';
      });
      return;
    }
    const meses = [];
    for(let i=5;i>=0;i--){
      const d = new Date(); d.setMonth(d.getMonth()-i);
      meses.push(d.toISOString().slice(0,7));
    }
    const ingPorMes = meses.map(m => STATE.ingresos.filter(i=>i.mes===m).reduce((a,i)=>a+Number(i.importe||0),0));
    const gasPorMes = meses.map(m => STATE.gastos.filter(g=>g.fecha && g.fecha.slice(0,7)===m).reduce((a,g)=>a+Number(g.importe||0),0));
    const ctx1 = document.getElementById('chartIngresosGastos');
    if(ctx1) new Chart(ctx1, {
      type:'bar',
      data:{ labels: meses.map(m=>new Date(m+'-02').toLocaleDateString('es-AR',{month:'short'})),
        datasets:[
          {label:'Ingresos', data:ingPorMes, backgroundColor:'#0a0a0a'},
          {label:'Gastos', data:gasPorMes, backgroundColor:'#f6cfd6'},
        ]},
      options:{responsive:true, plugins:{legend:{position:'bottom', labels:{font:{family:'Raleway'}}}}, scales:{y:{beginAtZero:true}}}
    });

    const porCliente = {};
    STATE.ingresos.forEach(i=>{ porCliente[i.cliente] = (porCliente[i.cliente]||0) + Number(i.importe||0); });
    const clientesOrd = Object.entries(porCliente).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const ctx2 = document.getElementById('chartFacturacionCliente');
    if(ctx2) new Chart(ctx2, {
      type:'doughnut',
      data:{ labels: clientesOrd.map(c=>c[0]), datasets:[{data:clientesOrd.map(c=>c[1]), backgroundColor:['#0a0a0a','#f6cfd6','#ecb6c1','#8a8580','#e8e5e1','#c9899a']}]},
      options:{responsive:true, plugins:{legend:{position:'bottom', labels:{font:{family:'Raleway', size:10}}}}}
    });

    const porServicio = {};
    STATE.ingresos.forEach(i=>{ const s=i.servicio||'Sin especificar'; porServicio[s]=(porServicio[s]||0)+Number(i.importe||0); });
    const servOrd = Object.entries(porServicio).sort((a,b)=>b[1]-a[1]);
    const ctx3 = document.getElementById('chartServicio');
    if(ctx3) new Chart(ctx3, {
      type:'bar',
      data:{ labels: servOrd.map(s=>s[0]), datasets:[{label:'Ingresos', data:servOrd.map(s=>s[1]), backgroundColor:'#ecb6c1'}]},
      options:{indexAxis:'y', responsive:true, plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}}
    });
  },0);
}

function renderListaPagosPendientes(){
  const items = STATE.ingresos.filter(i=>i.estado==='pendiente'||i.estado==='vencido'||i.estado==='parcial')
    .sort((a,b)=> (a.vencimiento||'').localeCompare(b.vencimiento||''));
  if(items.length===0) return `<div class="estado-vacio"><span class="script">Todo al día</span><p>No hay pagos pendientes ni vencidos.</p></div>`;
  return `<ul class="lista-simple">${items.slice(0,8).map(i=>`
    <li><div><div class="nombre">${escapeHTML(i.cliente)}</div><div class="detalle">${escapeHTML(i.concepto)} · vence ${fechaVista(i.vencimiento)}</div></div>
    <div style="text-align:right;"><div>${moneda(i.importe)}</div><span class="pill ${i.estado}">${etiquetaEstadoIngreso(i.estado)}</span></div></li>`).join('')}</ul>`;
}
function renderListaTareasPrioritarias(){
  const items = STATE.tareas.filter(t=>t.estado!=='finalizada').sort((a,b)=>{
    const orden = {urgente:0, alta:1, media:2, baja:3};
    return (orden[a.prioridad]??9)-(orden[b.prioridad]??9) || (a.fechaEntrega||'').localeCompare(b.fechaEntrega||'');
  });
  if(items.length===0) return `<div class="estado-vacio"><span class="script">Sin pendientes</span><p>No hay tareas pendientes.</p></div>`;
  return `<ul class="lista-simple">${items.slice(0,8).map(t=>`
    <li><div><div class="nombre">${escapeHTML(t.titulo)}</div><div class="detalle">${escapeHTML(t.cliente||'General')} · entrega ${fechaVista(t.fechaEntrega)}</div></div>
    <span class="pill ${t.prioridad}">${t.prioridad}</span></li>`).join('')}</ul>`;
}
function renderListaSeguimientos(){
  const items = STATE.oportunidades.filter(o=>!['ganado','no_interesado'].includes(o.estado) && o.proximoSeguimiento)
    .sort((a,b)=>(a.proximoSeguimiento||'').localeCompare(b.proximoSeguimiento||''));
  if(items.length===0) return `<div class="estado-vacio"><span class="script">Al día</span><p>No hay seguimientos programados.</p></div>`;
  return `<ul class="lista-simple">${items.slice(0,8).map(o=>{
    const dias = diasEntre(o.proximoSeguimiento);
    return `<li><div><div class="nombre">${escapeHTML(o.marca)}</div><div class="detalle">${escapeHTML(estadoOportunidadLabel(o.estado))}</div></div>
    <span class="pill ${dias<0?'vencido':'pendiente'}">${dias<0?'atrasado':fechaVista(o.proximoSeguimiento)}</span></li>`;
  }).join('')}</ul>`;
}

function etiquetaEstadoIngreso(e){
  return {cobrado:'Cobrado', pendiente:'Pendiente', vencido:'Vencido', parcial:'Parcial'}[e] || e;
}

/* ---------------------------------------------------------------------
   7. CLIENTES
--------------------------------------------------------------------- */
let FILTRO_CLIENTES = {texto:'', estado:'', rubro:'', orden:'marca'};

function renderClientes(root){
  const rubros = [...new Set(STATE.clientes.map(c=>c.rubro).filter(Boolean))];
  let lista = STATE.clientes.filter(c=>{
    const t = FILTRO_CLIENTES.texto.toLowerCase();
    const okTexto = !t || (c.marca+c.contacto+c.rubro).toLowerCase().includes(t);
    const okEstado = !FILTRO_CLIENTES.estado || c.estado===FILTRO_CLIENTES.estado;
    const okRubro = !FILTRO_CLIENTES.rubro || c.rubro===FILTRO_CLIENTES.rubro;
    return okTexto && okEstado && okRubro;
  });
  lista.sort((a,b)=> (a[FILTRO_CLIENTES.orden]||'').toString().localeCompare((b[FILTRO_CLIENTES.orden]||'').toString()));

  root.innerHTML = `
    <div class="pagina-header">
      <div><h1>Clientes</h1><div class="sub">${STATE.clientes.length} clientes en total</div></div>
      <div class="pagina-acciones"><button class="btn rosa" id="btnNuevoCliente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('plus')}</svg>Nuevo cliente</button></div>
    </div>
    <div class="toolbar">
      <input type="text" id="fClienteTexto" placeholder="Buscar por marca o contacto…" value="${escapeHTML(FILTRO_CLIENTES.texto)}">
      <select id="fClienteEstado">
        <option value="">Todos los estados</option>
        ${['activo','pausado','potencial','finalizado'].map(e=>`<option value="${e}" ${FILTRO_CLIENTES.estado===e?'selected':''}>${capitaliza(e)}</option>`).join('')}
      </select>
      <select id="fClienteRubro">
        <option value="">Todos los rubros</option>
        ${rubros.map(r=>`<option value="${escapeHTML(r)}" ${FILTRO_CLIENTES.rubro===r?'selected':''}>${escapeHTML(r)}</option>`).join('')}
      </select>
      <select id="fClienteOrden">
        <option value="marca" ${FILTRO_CLIENTES.orden==='marca'?'selected':''}>Ordenar: Marca (A-Z)</option>
        <option value="fechaInicio" ${FILTRO_CLIENTES.orden==='fechaInicio'?'selected':''}>Ordenar: Fecha de inicio</option>
        <option value="estado" ${FILTRO_CLIENTES.orden==='estado'?'selected':''}>Ordenar: Estado</option>
      </select>
    </div>
    ${lista.length===0 ? `<div class="estado-vacio"><span class="script">Sin resultados</span><p>No se encontraron clientes con estos filtros.</p></div>` : `
    <div class="tabla-wrap"><table>
      <thead><tr><th>Marca</th><th>Contacto</th><th>Rubro</th><th>Estado</th><th>Valor mensual</th><th>Día de pago</th><th></th></tr></thead>
      <tbody>${lista.map(c=>`
        <tr>
          <td><strong>${escapeHTML(c.marca)}</strong></td>
          <td>${escapeHTML(c.contacto)}</td>
          <td>${escapeHTML(c.rubro)}</td>
          <td><span class="pill ${c.estado}">${capitaliza(c.estado)}</span></td>
          <td>${c.valorMensual ? moneda(c.valorMensual) : '—'}</td>
          <td>${c.diaPago || '—'}</td>
          <td class="acciones-fila">
            <button data-ver="${c.id}" title="Ver ficha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('eye')}</svg></button>
            <button data-editar="${c.id}" title="Editar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('edit')}</svg></button>
            <button data-eliminar="${c.id}" title="Eliminar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('trash')}</svg></button>
          </td>
        </tr>`).join('')}</tbody>
    </table></div>`}
  `;

  document.getElementById('btnNuevoCliente').onclick = ()=>abrirFormCliente();
  document.getElementById('fClienteTexto').oninput = (e)=>{ FILTRO_CLIENTES.texto=e.target.value; renderPagina(); };
  document.getElementById('fClienteEstado').onchange = (e)=>{ FILTRO_CLIENTES.estado=e.target.value; renderPagina(); };
  document.getElementById('fClienteRubro').onchange = (e)=>{ FILTRO_CLIENTES.rubro=e.target.value; renderPagina(); };
  document.getElementById('fClienteOrden').onchange = (e)=>{ FILTRO_CLIENTES.orden=e.target.value; renderPagina(); };
  root.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>abrirFichaCliente(b.dataset.ver));
  root.querySelectorAll('[data-editar]').forEach(b=>b.onclick=()=>abrirFormCliente(b.dataset.editar));
  root.querySelectorAll('[data-eliminar]').forEach(b=>b.onclick=()=>{
    const c = STATE.clientes.find(x=>x.id===b.dataset.eliminar);
    confirmarAccion(`¿Eliminar al cliente "${c.marca}"? Esta acción no se puede deshacer.`, ()=>{
      STATE.clientes = STATE.clientes.filter(x=>x.id!==c.id);
      marcarCambio(renderPagina);
      toast('Cliente eliminado', 'exito');
    });
  });
}

function capitaliza(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

    cuerpoHTML: `
      <div class="fila-campos">
        <div class="campo"><label>Marca <span class="req">*</span></label><input id="c_marca" value="${escapeHTML(c.marca)}"></div>
        <div class="campo"><label>Contacto</label><input id="c_contacto" value="${escapeHTML(c.contacto)}"></div>
      </div>

        <div class="campo"><label>Rubro</label><input id="c_rubro" value="${escapeHTML(c.rubro)}"></div>
        <div class="campo"><label>Estado</label><select id="c_estado">${['activo','pausado','potencial','finalizado'].map(e=>`<option value="${e}" ${c.estado===e?'selected':''}>${capitaliza(e)}</option>`).join('')}</select></div>
        <div class="campo"><label>Fecha de inicio</label><input type="date" id="c_fechaInicio" value="${c.fechaInicio||''}"></div>
      </div>
      <div class="fila-campos tres">
        <div class="campo"><label>Correo</label><input type="email" id="c_email" value="${escapeHTML(c.email)}"></div>
        <div class="campo"><label>Teléfono</label><input id="c_telefono" value="${escapeHTML(c.telefono)}"></div>
        <div class="campo"><label>Instagram</label><input id="c_instagram" value="${escapeHTML(c.instagram)}"></div>
      </div>
      <div class="campo"><label>Sitio web</label><input id="c_sitioweb" value="${escapeHTML(c.sitioweb)}"></div>
      <div class="campo"><label>Servicios contratados</label><input id="c_servicios" value="${escapeHTML(c.servicios)}" placeholder="Ej: Manejo integral de redes, Diseño de menú"></div>
      <div class="fila-campos tres">
        <div class="campo"><label>Valor mensual</label><input type="number" id="c_valorMensual" value="${c.valorMensual||''}"></div>
        <div class="campo"><label>Día de pago</label><input type="number" min="1" max="31" id="c_diaPago" value="${c.diaPago||''}"></div>
        <div class="campo"><label>Forma de pago</label><input id="c_formaPago" value="${escapeHTML(c.formaPago)}"></div>
      </div>
      <div class="fila-campos">
        <div class="campo"><label>Próximo ajuste</label><input type="date" id="c_proximoAjuste" value="${c.proximoAjuste||''}"></div>
        <div class="campo"><label>Frecuencia de ajuste</label><input id="c_frecuenciaAjuste" value="${escapeHTML(c.frecuenciaAjuste)}" placeholder="Semestral, anual…"></div>
      </div>

        <div class="campo"><label>Link Canva</label><input id="c_canva" value="${escapeHTML(c.canva)}"></div>
        <div class="campo"><label>Link Instagram</label><input id="c_ig" value="${escapeHTML(c.ig)}"></div>

function val(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }

function abrirFichaCliente(id){
  const c = STATE.clientes.find(x=>x.id===id);
  if(!c) return;
  const tareasCliente = STATE.tareas.filter(t=>t.cliente===c.marca);
  const ingresosCliente = STATE.ingresos.filter(i=>i.cliente===c.marca);
  const presuCliente = STATE.presupuestos.filter(p=>p.cliente===c.marca);
  const totalFacturado = ingresosCliente.reduce((a,i)=>a+Number(i.importe||0),0);
  abrirModal({
    titulo: c.marca, ancho:true,
    cuerpoHTML: `
      <div class="ficha-tabs">
        <button class="ftab activo" data-tab="datos">Datos</button>
        <button class="ftab" data-tab="pagos">Historial de pagos</button>
        <button class="ftab" data-tab="tareas">Tareas</button>
        <button class="ftab" data-tab="presupuestos">Presupuestos</button>
      </div>
      <div id="ftab-datos" class="ftab-panel">
        <div class="grid-3col">
          <div><div class="etiqueta texto-gris" style="font-size:0.7rem; text-transform:uppercase;">Rubro</div><div>${escapeHTML(c.rubro)||'—'}</div></div>
          <div><div class="etiqueta texto-gris" style="font-size:0.7rem; text-transform:uppercase;">Estado</div><span class="pill ${c.estado}">${capitaliza(c.estado)}</span></div>
          <div><div class="etiqueta texto-gris" style="font-size:0.7rem; text-transform:uppercase;">Valor mensual</div><div>${c.valorMensual?moneda(c.valorMensual):'—'}</div></div>
        </div>
        <hr class="linea">
        <p><strong>Contacto:</strong> ${escapeHTML(c.contacto)||'—'} · ${escapeHTML(c.email)||'—'} · ${escapeHTML(c.telefono)||'—'}</p>
        <p><strong>Servicios contratados:</strong> ${escapeHTML(c.servicios)||'—'}</p>
        <p><strong>Total facturado histórico:</strong> ${moneda(totalFacturado)}</p>
        ${c.notas ? `<p style="margin-top:10px;"><strong>Notas:</strong> ${escapeHTML(c.notas)}</p>` : ''}
      </div>
      <div id="ftab-pagos" class="ftab-panel oculto">
        ${ingresosCliente.length===0 ? `<div class="estado-vacio"><p>Sin registros de pago.</p></div>` :
        `<ul class="lista-simple">${ingresosCliente.map(i=>`<li><div><div class="nombre">${escapeHTML(i.concepto)}</div><div class="detalle">${fechaVista(i.fecha)}</div></div><div><div>${moneda(i.importe)}</div><span class="pill ${i.estado}">${etiquetaEstadoIngreso(i.estado)}</span></div></li>`).join('')}</ul>`}
      </div>
      <div id="ftab-tareas" class="ftab-panel oculto">
        ${tareasCliente.length===0 ? `<div class="estado-vacio"><p>Sin tareas asociadas.</p></div>` :
        `<ul class="lista-simple">${tareasCliente.map(t=>`<li><div class="nombre">${escapeHTML(t.titulo)}</div><span class="pill ${t.estado.replace('_','')}">${t.estado.replace('_',' ')}</span></li>`).join('')}</ul>`}
      </div>
      <div id="ftab-presupuestos" class="ftab-panel oculto">
        ${presuCliente.length===0 ? `<div class="estado-vacio"><p>Sin presupuestos asociados.</p></div>` :
        `<ul class="lista-simple">${presuCliente.map(p=>`<li><div class="nombre">Presupuesto #${p.numero}</div><span class="pill ${p.estado}">${capitaliza(p.estado)}</span></li>`).join('')}</ul>`}
      </div>
    `,
    footerHTML:`<button class="btn outline" id="btnPresuDesdeFicha">Crear presupuesto</button><button class="btn rosa" id="btnEditarDesdeFicha">Editar cliente</button>`,
    onAbrir: ()=>{
      document.querySelectorAll('.ftab').forEach(b=>b.onclick=()=>{
        document.querySelectorAll('.ftab').forEach(x=>x.classList.remove('activo'));
        document.querySelectorAll('.ftab-panel').forEach(x=>x.classList.add('oculto'));
        b.classList.add('activo');
        document.getElementById('ftab-'+b.dataset.tab).classList.remove('oculto');
      });
      document.getElementById('btnEditarDesdeFicha').onclick = ()=>{ cerrarModal(); abrirFormCliente(c.id); };
      document.getElementById('btnPresuDesdeFicha').onclick = ()=>{ cerrarModal(); abrirFormPresupuesto(null, c.marca); };
    }
  });
}

/* ---------------------------------------------------------------------
   8. OPORTUNIDADES
--------------------------------------------------------------------- */
const ESTADOS_OP = ['por_contactar','primer_mensaje','respondio','reunion_coordinada','propuesta_preparacion','presupuesto_enviado','en_negociacion','ganado','no_interesado','retomar'];
function estadoOportunidadLabel(e){
  return {por_contactar:'Por contactar', primer_mensaje:'Primer mensaje enviado', respondio:'Respondió', reunion_coordinada:'Reunión coordinada',
    propuesta_preparacion:'Propuesta en preparación', presupuesto_enviado:'Presupuesto enviado', en_negociacion:'En negociación',
    ganado:'Ganado', no_interesado:'No interesado', retomar:'Retomar más adelante'}[e] || e;
}
let VISTA_OPORTUNIDADES = 'kanban';

function renderOportunidades(root){
  root.innerHTML = `
    <div class="pagina-header">
      <div><h1>Oportunidades</h1><div class="sub">${STATE.oportunidades.length} en seguimiento comercial</div></div>
      <div class="pagina-acciones"><button class="btn rosa" id="btnNuevaOp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('plus')}</svg>Nueva oportunidad</button></div>
    </div>
    <div class="toolbar">
      <div class="vista-toggle">
        <button data-v="kanban" class="${VISTA_OPORTUNIDADES==='kanban'?'activo':''}">Kanban</button>
        <button data-v="tabla" class="${VISTA_OPORTUNIDADES==='tabla'?'activo':''}">Tabla</button>
      </div>
    </div>
    <div id="opContenido"></div>
  `;
  document.getElementById('btnNuevaOp').onclick = ()=>abrirFormOportunidad();
  root.querySelectorAll('.vista-toggle button').forEach(b=>b.onclick=()=>{ VISTA_OPORTUNIDADES=b.dataset.v; renderPagina(); });
  const cont = document.getElementById('opContenido');
  if(VISTA_OPORTUNIDADES==='kanban') cont.innerHTML = renderKanbanOportunidades();
  else cont.innerHTML = renderTablaOportunidades();
  activarAccionesOportunidades(cont);
  if(VISTA_OPORTUNIDADES==='kanban') activarDragOportunidades(cont);
}

function renderKanbanOportunidades(){
  return `<div class="kanban">${ESTADOS_OP.map(e=>{
    const items = STATE.oportunidades.filter(o=>o.estado===e);
    return `<div class="kanban-col" data-estado="${e}">
      <h4>${estadoOportunidadLabel(e)} <span>${items.length}</span></h4>
      <div class="kanban-cards" data-estado-lista="${e}">
        ${items.map(o=>`<div class="kanban-card" draggable="true" data-id="${o.id}">
          <div class="titulo-card">${escapeHTML(o.marca)}</div>
          <div class="texto-gris" style="font-size:0.72rem;">${escapeHTML(o.rubro||'')}</div>
          <div class="meta-card"><span>${o.presupuestoEstimado?moneda(o.presupuestoEstimado):''}</span><span>${o.proximoSeguimiento?fechaVista(o.proximoSeguimiento):''}</span></div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;
}
function renderTablaOportunidades(){
  const lista = [...STATE.oportunidades].sort((a,b)=>(a.proximoSeguimiento||'9999').localeCompare(b.proximoSeguimiento||'9999'));
  if(lista.length===0) return `<div class="estado-vacio"><span class="script">Sin oportunidades</span></div>`;
  return `<div class="tabla-wrap"><table>
    <thead><tr><th>Marca</th><th>Contacto</th><th>Servicio de interés</th><th>Estado</th><th>Próx. seguimiento</th><th></th></tr></thead>
    <tbody>${lista.map(o=>`
      <tr>
        <td><strong>${escapeHTML(o.marca)}</strong></td>
        <td>${escapeHTML(o.contacto)}</td>
        <td>${escapeHTML(o.servicioInteres)}</td>
        <td><span class="pill ${o.estado.replace('_','')}">${estadoOportunidadLabel(o.estado)}</span></td>
        <td>${fechaVista(o.proximoSeguimiento)}</td>
        <td class="acciones-fila">
          <button data-editar-op="${o.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('edit')}</svg></button>
          <button data-eliminar-op="${o.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('trash')}</svg></button>
        </td>
      </tr>`).join('')}</tbody>
  </table></div>`;
}
function activarAccionesOportunidades(cont){
  cont.querySelectorAll('[data-editar-op]').forEach(b=>b.onclick=()=>abrirFormOportunidad(b.dataset.editarOp));
  cont.querySelectorAll('[data-eliminar-op]').forEach(b=>b.onclick=()=>{
    const o = STATE.oportunidades.find(x=>x.id===b.dataset.eliminarOp);
    confirmarAccion(`¿Eliminar la oportunidad "${o.marca}"?`, ()=>{
      STATE.oportunidades = STATE.oportunidades.filter(x=>x.id!==o.id);
      marcarCambio(renderPagina); toast('Oportunidad eliminada','exito');
    });
  });
  cont.querySelectorAll('.kanban-card').forEach(card=>{
    card.onclick = ()=>abrirFormOportunidad(card.dataset.id);
  });
}
function activarDragOportunidades(cont){
  let arrastrando = null;
  cont.querySelectorAll('.kanban-card').forEach(card=>{
    card.addEventListener('dragstart', ()=>{ arrastrando = card.dataset.id; card.classList.add('arrastrando'); });
    card.addEventListener('dragend', ()=>{ card.classList.remove('arrastrando'); });
  });
  cont.querySelectorAll('.kanban-col').forEach(col=>{
    col.addEventListener('dragover', (e)=>{ e.preventDefault(); col.classList.add('sobre'); });
    col.addEventListener('dragleave', ()=>col.classList.remove('sobre'));
    col.addEventListener('drop', (e)=>{
      e.preventDefault(); col.classList.remove('sobre');
      const op = STATE.oportunidades.find(x=>x.id===arrastrando);
      if(op){ op.estado = col.dataset.estado; marcarCambio(renderPagina); toast('Oportunidad movida a "'+estadoOportunidadLabel(op.estado)+'"','exito'); }
    });
  });
}

            o.estado='ganado';
            cerrarModal(); marcarCambio(renderPagina); toast('Oportunidad convertida en cliente','exito');

          fechaUltimoContacto:val('o_fechaUltimoContacto'), proximoSeguimiento:val('o_proximoSeguimiento'),
          ultimoMensaje:val('o_ultimoMensaje'), estado:val('o_estado'), notas:val('o_notas'),
        };
        if(editando) Object.assign(o, datos);

        cerrarModal(); marcarCambio(renderPagina); toast(editando?'Oportunidad actualizada':'Oportunidad creada','exito');

--------------------------------------------------------------------- */
let TAB_FINANZAS = 'resumen';
let FILTRO_FIN = {mes:'', cliente:'', estado:''};

function renderFinanzas(root){
  root.innerHTML = `
    <div class="pagina-header">
      <div><h1>Finanzas</h1><div class="sub">Ingresos, gastos y pagos pendientes</div></div>
      <div class="pagina-acciones">
        <button class="btn outline" id="btnExportCSV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('download')}</svg>Exportar CSV</button>
        <button class="btn rosa" id="btnNuevoMovimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('plus')}</svg>Nuevo movimiento</button>
      </div>
    </div>
    <div class="ficha-tabs">
      ${['resumen','ingresos','gastos','pendientes'].map(t=>`<button class="ftabfin ${TAB_FINANZAS===t?'activo':''}" data-tab="${t}">${capitaliza(t)}</button>`).join('')}
    </div>
    <div id="finContenido"></div>
  `;
  root.querySelectorAll('.ftabfin').forEach(b=>b.onclick=()=>{ TAB_FINANZAS=b.dataset.tab; renderPagina(); });
  document.getElementById('btnNuevoMovimiento').onclick = ()=>{
    if(TAB_FINANZAS==='gastos') abrirFormGasto(); else abrirFormIngreso();
  };
  document.getElementById('btnExportCSV').onclick = exportarFinanzasCSV;

  const cont = document.getElementById('finContenido');
  if(TAB_FINANZAS==='resumen') cont.innerHTML = renderResumenFinanzas();
  else if(TAB_FINANZAS==='ingresos') cont.innerHTML = renderTablaIngresos();
  else if(TAB_FINANZAS==='gastos') cont.innerHTML = renderTablaGastos();
  else cont.innerHTML = renderTablaPendientes();
  activarAccionesFinanzas(cont);
  if(TAB_FINANZAS==='resumen') dibujarGraficosResumen();
}

function renderResumenFinanzas(){
  const totalIng = STATE.ingresos.reduce((a,i)=>a+Number(i.importe||0),0);
  const cobrado = STATE.ingresos.filter(i=>i.estado==='cobrado').reduce((a,i)=>a+Number(i.importe||0),0);
  const pendiente = STATE.ingresos.filter(i=>i.estado==='pendiente').reduce((a,i)=>a+Number(i.importe||0),0);
  const vencido = STATE.ingresos.filter(i=>i.estado==='vencido').reduce((a,i)=>a+Number(i.importe||0),0);
  const totalGas = STATE.gastos.reduce((a,g)=>a+Number(g.importe||0),0);
  const gastosFijos = STATE.gastos.filter(g=>g.tipo==='fijo').reduce((a,g)=>a+Number(g.importe||0),0);
  const gastosVariables = STATE.gastos.filter(g=>g.tipo==='variable').reduce((a,g)=>a+Number(g.importe||0),0);
  const neta = totalIng-totalGas;
  const rentabilidad = totalIng>0 ? ((neta/totalIng)*100).toFixed(1) : '0';
  return `
    <div class="grid-cards">
      <div class="card negro"><div class="etiqueta">Total ingresos</div><div class="valor">${moneda(totalIng)}</div></div>
      <div class="card"><div class="etiqueta">Total gastos</div><div class="valor">${moneda(totalGas)}</div></div>
      <div class="card acento"><div class="etiqueta">Ganancia neta</div><div class="valor rosa-texto">${moneda(neta)}</div></div>
      <div class="card"><div class="etiqueta">% Rentabilidad</div><div class="valor">${rentabilidad}%</div></div>
      <div class="card"><div class="etiqueta">Cobrado</div><div class="valor">${moneda(cobrado)}</div></div>
      <div class="card"><div class="etiqueta">Pendiente</div><div class="valor">${moneda(pendiente)}</div></div>
      <div class="card"><div class="etiqueta">Vencido</div><div class="valor" style="color:#a1352d;">${moneda(vencido)}</div></div>
      <div class="card"><div class="etiqueta">Gastos fijos / variables</div><div class="valor" style="font-size:1.1rem;">${moneda(gastosFijos)} / ${moneda(gastosVariables)}</div></div>
    </div>
    <div class="grid-2">
      <div class="panel"><h3>Gastos por categoría</h3><canvas id="chartGastosCat" height="230"></canvas></div>
      <div class="panel"><h3>Estado de los ingresos</h3><canvas id="chartEstadoIng" height="230"></canvas></div>
    </div>
  `;
}
function dibujarGraficosResumen(){
  setTimeout(()=>{
    if(typeof Chart === 'undefined'){
      document.querySelectorAll('#chartGastosCat, #chartEstadoIng').forEach(c=>{
        c.insertAdjacentHTML('afterend', '<p class="texto-gris" style="font-size:0.75rem;">Los gráficos necesitan conexión a internet para cargar.</p>');
        c.style.display = 'none';
      });
      return;
    }
    const porCat = {};
    STATE.gastos.forEach(g=>{ porCat[g.categoria]=(porCat[g.categoria]||0)+Number(g.importe||0); });
    const ctx1 = document.getElementById('chartGastosCat');
    if(ctx1) new Chart(ctx1,{type:'doughnut', data:{labels:Object.keys(porCat), datasets:[{data:Object.values(porCat), backgroundColor:['#0a0a0a','#f6cfd6','#ecb6c1','#8a8580','#e8e5e1','#c9899a','#d9c2c8']}]}, options:{plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}}});
    const estados = ['cobrado','pendiente','vencido','parcial'];
    const cantidades = estados.map(e=>STATE.ingresos.filter(i=>i.estado===e).length);
    const ctx2 = document.getElementById('chartEstadoIng');
    if(ctx2) new Chart(ctx2,{type:'bar', data:{labels:estados.map(e=>etiquetaEstadoIngreso(e)), datasets:[{data:cantidades, backgroundColor:['#4d7a48','#8a6a2f','#a1352d','#c9899a']}]}, options:{plugins:{legend:{display:false}}}});
  },0);
}

function renderTablaIngresos(){
  const clientes = [...new Set(STATE.ingresos.map(i=>i.cliente))];
  let lista = STATE.ingresos.filter(i=>{
    const okMes = !FILTRO_FIN.mes || i.mes===FILTRO_FIN.mes;
    const okCli = !FILTRO_FIN.cliente || i.cliente===FILTRO_FIN.cliente;
    const okEst = !FILTRO_FIN.estado || i.estado===FILTRO_FIN.estado;
    return okMes && okCli && okEst;
  }).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return `
    <div class="toolbar">
      <input type="month" id="ffMes" value="${FILTRO_FIN.mes}">
      <select id="ffCliente"><option value="">Todos los clientes</option>${clientes.map(c=>`<option ${FILTRO_FIN.cliente===c?'selected':''}>${escapeHTML(c)}</option>`).join('')}</select>
      <select id="ffEstado"><option value="">Todos los estados</option>${['cobrado','pendiente','vencido','parcial'].map(e=>`<option value="${e}" ${FILTRO_FIN.estado===e?'selected':''}>${etiquetaEstadoIngreso(e)}</option>`).join('')}</select>
    </div>
    ${lista.length===0?`<div class="estado-vacio"><span class="script">Sin ingresos</span><p>No hay ingresos con estos filtros.</p></div>`:`
    <div class="tabla-wrap"><table>
      <thead><tr><th>Fecha</th><th>Cliente</th><th>Concepto</th><th>Servicio</th><th>Importe</th><th>Estado</th><th></th></tr></thead>
      <tbody>${lista.map(i=>`
        <tr><td>${fechaVista(i.fecha)}</td><td>${escapeHTML(i.cliente)}</td><td>${escapeHTML(i.concepto)}</td><td>${escapeHTML(i.servicio)}</td>
        <td>${moneda(i.importe)}</td><td><span class="pill ${i.estado}">${etiquetaEstadoIngreso(i.estado)}</span></td>
        <td class="acciones-fila">
          <button data-editar-ing="${i.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('edit')}</svg></button>
          <button data-eliminar-ing="${i.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('trash')}</svg></button>
        </td></tr>`).join('')}</tbody>
    </table></div>`}
  `;
}
function renderTablaGastos(){
  let lista = [...STATE.gastos].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return `
    ${lista.length===0?`<div class="estado-vacio"><span class="script">Sin gastos</span></div>`:`
    <div class="tabla-wrap"><table>
      <thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Importe</th><th>Tipo</th><th>Cliente</th><th></th></tr></thead>

        <td class="acciones-fila">
          <button data-editar-gas="${g.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('edit')}</svg></button>
          <button data-eliminar-gas="${g.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('trash')}</svg></button>
        </td></tr>`).join('')}</tbody>
    </table></div>`}
  `;
}
function renderTablaPendientes(){
  const lista = STATE.ingresos.filter(i=>i.estado==='pendiente'||i.estado==='vencido'||i.estado==='parcial').sort((a,b)=>(a.vencimiento||'').localeCompare(b.vencimiento||''));
  if(lista.length===0) return `<div class="estado-vacio"><span class="script">Al día</span><p>No hay pagos pendientes.</p></div>`;
  return `<div class="tabla-wrap"><table>
    <thead><tr><th>Cliente</th><th>Concepto</th><th>Importe</th><th>Vencimiento</th><th>Estado</th><th></th></tr></thead>
    <tbody>${lista.map(i=>`
      <tr><td>${escapeHTML(i.cliente)}</td><td>${escapeHTML(i.concepto)}</td><td>${moneda(i.importe)}</td>
      <td>${fechaVista(i.vencimiento)}</td><td><span class="pill ${i.estado}">${etiquetaEstadoIngreso(i.estado)}</span></td>
      <td class="acciones-fila"><button data-marcar-cobrado="${i.id}" title="Marcar como cobrado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></button></td></tr>`).join('')}</tbody>
  </table></div>`;
}
function activarAccionesFinanzas(cont){
  const mesEl = document.getElementById('ffMes'); if(mesEl) mesEl.onchange=(e)=>{FILTRO_FIN.mes=e.target.value; renderPagina();};
  const cliEl = document.getElementById('ffCliente'); if(cliEl) cliEl.onchange=(e)=>{FILTRO_FIN.cliente=e.target.value; renderPagina();};
  const estEl = document.getElementById('ffEstado'); if(estEl) estEl.onchange=(e)=>{FILTRO_FIN.estado=e.target.value; renderPagina();};
  cont.querySelectorAll('[data-editar-ing]').forEach(b=>b.onclick=()=>abrirFormIngreso(b.dataset.editarIng));
  cont.querySelectorAll('[data-eliminar-ing]').forEach(b=>b.onclick=()=>{
    confirmarAccion('¿Eliminar este ingreso?', ()=>{ STATE.ingresos=STATE.ingresos.filter(x=>x.id!==b.dataset.eliminarIng); marcarCambio(renderPagina); toast('Ingreso eliminado','exito'); });
  });
  cont.querySelectorAll('[data-editar-gas]').forEach(b=>b.onclick=()=>abrirFormGasto(b.dataset.editarGas));
  cont.querySelectorAll('[data-eliminar-gas]').forEach(b=>b.onclick=()=>{
    confirmarAccion('¿Eliminar este gasto?', ()=>{ STATE.gastos=STATE.gastos.filter(x=>x.id!==b.dataset.eliminarGas); marcarCambio(renderPagina); toast('Gasto eliminado','exito'); });
  });
  cont.querySelectorAll('[data-marcar-cobrado]').forEach(b=>b.onclick=()=>{
    const i = STATE.ingresos.find(x=>x.id===b.dataset.marcarCobrado);
    i.estado='cobrado'; marcarCambio(renderPagina); toast('Marcado como cobrado','exito');
  });
}

function exportarFinanzasCSV(){
  let csv = 'Tipo,Fecha,Cliente/Categoria,Concepto/Descripcion,Importe,Estado/Tipo\n';
  STATE.ingresos.forEach(i=> csv += `Ingreso,${i.fecha},"${i.cliente}","${i.concepto}",${i.importe},${i.estado}\n`);
  STATE.gastos.forEach(g=> csv += `Gasto,${g.fecha},"${g.categoria}","${g.descripcion}",${g.importe},${g.tipo}\n`);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'trama-finanzas.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('Archivo CSV exportado','exito');
}

    confirmarAccion('¿Eliminar este servicio del catálogo?', ()=>{
      STATE.servicios = STATE.servicios.filter(x=>x.id!==b.dataset.eliminarServ);
      marcarCambio(renderPagina); toast('Servicio eliminado','exito');
    });
  });
}
function etiquetaModalidad(m){
  return {mensual:'Mensual', por_proyecto:'Por proyecto', por_jornada:'Por jornada', por_pieza:'Por pieza', por_hora:'Por hora'}[m] || m;
}
function abrirFormServicio(id){
  const editando = !!id;
  const s = editando ? STATE.servicios.find(x=>x.id===id) : {nombre:'',categoria:'',descripcion:'',precioBase:'',modalidad:'mensual',duracion:'',entregables:'',revisiones:'',gastosAdicionales:'',estado:'activo',notas:''};

    cuerpoHTML:`
      <div class="fila-campos">
        <div class="campo"><label>Nombre <span class="req">*</span></label><input id="s_nombre" value="${escapeHTML(s.nombre)}"></div>
        <div class="campo"><label>Categoría</label><input id="s_categoria" value="${escapeHTML(s.categoria)}"></div>

      <div class="campo"><label>Descripción</label><textarea id="s_descripcion">${escapeHTML(s.descripcion)}</textarea></div>
      <div class="fila-campos tres">
        <div class="campo"><label>Precio base <span class="req">*</span></label><input type="number" id="s_precioBase" value="${s.precioBase}"></div>
        <div class="campo"><label>Modalidad de cobro</label><select id="s_modalidad">${['mensual','por_proyecto','por_jornada','por_pieza','por_hora'].map(m=>`<option value="${m}" ${s.modalidad===m?'selected':''}>${etiquetaModalidad(m)}</option>`).join('')}</select></div>
        <div class="campo"><label>Duración estimada</label><input id="s_duracion" value="${escapeHTML(s.duracion)}"></div>

      <div class="fila-campos">

        <div class="campo"><label>Cantidad de revisiones</label><input type="number" id="s_revisiones" value="${s.revisiones}"></div>
      </div>
      <div class="campo"><label>Gastos adicionales posibles</label><input id="s_gastosAdicionales" value="${escapeHTML(s.gastosAdicionales)}"></div>
      <div class="campo"><label>Notas</label><textarea id="s_notas">${escapeHTML(s.notas)}</textarea></div>
    `,
    footerHTML:`<button class="btn outline" id="btnCancelarServ">Cancelar</button><button class="btn rosa" id="btnGuardarServ">Guardar</button>`,
    onAbrir:()=>{

      document.getElementById('btnGuardarServ').onclick = ()=>{
        const nombre = val('s_nombre'); const precioBase = Number(val('s_precioBase'));
        if(!nombre || !precioBase){ toast('Nombre y precio base son obligatorios','error'); return; }
        const datos = {nombre, categoria:val('s_categoria'), descripcion:val('s_descripcion'), precioBase, modalidad:val('s_modalidad'),
          duracion:val('s_duracion'), entregables:val('s_entregables'), revisiones:Number(val('s_revisiones'))||0,
          gastosAdicionales:val('s_gastosAdicionales'), estado:'activo', notas:val('s_notas')};
        if(editando) Object.assign(s, datos); else STATE.servicios.push({id:uid('ser'), ...datos});
        cerrarModal(); marcarCambio(renderPagina); toast(editando?'Servicio actualizado':'Servicio creado','exito');
      };

}

function renderPresupuestos(root){
  const lista = [...STATE.presupuestos].sort((a,b)=>(b.numero||'').localeCompare(a.numero||''));
  root.innerHTML = `
    <div class="pagina-header">
      <div><h1>Presupuestos</h1><div class="sub">${STATE.presupuestos.length} presupuestos generados</div></div>
      <div class="pagina-acciones"><button class="btn rosa" id="btnNuevoPresu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('plus')}</svg>Nuevo presupuesto</button></div>
    </div>
    ${lista.length===0?`<div class="estado-vacio"><span class="script">Sin presupuestos</span><p>Creá tu primer presupuesto para un cliente u oportunidad.</p></div>`:`
    <div class="tabla-wrap"><table>
      <thead><tr><th>Nº</th><th>Cliente</th><th>Fecha</th><th>Validez</th><th>Total</th><th>Estado</th><th></th></tr></thead>
      <tbody>${lista.map(p=>`
        <tr><td>#${p.numero}</td><td>${escapeHTML(p.cliente)}</td><td>${fechaVista(p.fecha)}</td><td>${fechaVista(p.validez)}</td>
        <td>${moneda(totalPresupuesto(p))}</td><td><span class="pill ${p.estado}">${capitaliza(p.estado)}</span></td>
        <td class="acciones-fila">
          <button data-ver-presu="${p.id}" title="Ver / imprimir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('eye')}</svg></button>
          <button data-editar-presu="${p.id}" title="Editar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('edit')}</svg></button>
          <button data-duplicar-presu="${p.id}" title="Duplicar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('copy')}</svg></button>
          <button data-eliminar-presu="${p.id}" title="Eliminar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconoSvg('trash')}</svg></button>
        </td></tr>`).join('')}</tbody>
    </table></div>`}
  `;
  document.getElementById('btnNuevoPresu').onclick = ()=>abrirFormPresupuesto();
  root.querySelectorAll('[data-ver-presu]').forEach(b=>b.onclick=()=>verPresupuesto(b.dataset.verPresu));
  root.querySelectorAll('[data-editar-presu]').forEach(b=>b.onclick=()=>abrirFormPresupuesto(b.dataset.editarPresu));
  root.querySelectorAll('[data-duplicar-presu]').forEach(b=>b.onclick=()=>{
    const p = STATE.presupuestos.find(x=>x.id===b.dataset.duplicarPresu);
    const nuevo = JSON.parse(JSON.stringify(p));
    nuevo.id = uid('pre'); nuevo.numero = proximoNumeroPresupuesto(); nuevo.estado='borrador'; nuevo.fecha=hoy();
    STATE.presupuestos.push(nuevo); marcarCambio(renderPagina); toast('Presupuesto duplicado','exito');
  });
  root.querySelectorAll('[data-eliminar-presu]').forEach(b=>b.onclick=()=>{
    confirmarAccion('¿Eliminar este presupuesto?', ()=>{
      STATE.presupuestos = STATE.presupuestos.filter(x=>x.id!==b.dataset.eliminarPresu);
      marcarCambio(renderPagina); toast('Presupuesto eliminado','exito');
    });
  });
}
function totalPresupuesto(p){
  const sub = (p.items||[]).reduce((a,it)=>a+(Number(it.precio||0)*Number(it.cantidad||1)),0);
  const conDescuento = sub - (sub*(Number(p.descuento||0)/100));
  return conDescuento + Number(p.adicionales||0);
}
function proximoNumeroPresupuesto(){
  STATE.contador.presupuesto = (STATE.contador.presupuesto||0)+1;
  return String(STATE.contador.presupuesto).padStart(4,'0');
}

function abrirFormPresupuesto(id, clientePrefill){
  const editando = !!id;
  const p = editando ? STATE.presupuestos.find(x=>x.id===id) : {
    numero: proximoNumeroPresupuesto(), fecha:hoy(), validez:new Date(Date.now()+14*86400000).toISOString().slice(0,10),
    cliente:clientePrefill||'', contacto:'', items:[{servicio:'',descripcion:'',cantidad:1,precio:0}], descuento:0, adicionales:0,
    formaPago:STATE.config.metodosPago||'', condiciones:STATE.config.condicionesPresupuesto||'', notas:'', estado:'borrador'
  };
  const nombresClientes = STATE.clientes.map(c=>c.marca);

  function filasItems(){
    return p.items.map((it,idx)=>`
      <div class="fila-campos" style="grid-template-columns:2fr 0.7fr 1fr 1fr auto; align-items:end; gap:8px;" data-fila-item="${idx}">
        <div class="campo"><label>Servicio</label><input list="lista_servicios_p" data-item="servicio" data-idx="${idx}" value="${escapeHTML(it.servicio)}"></div>
        <div class="campo"><label>Cant.</label><input type="number" min="1" data-item="cantidad" data-idx="${idx}" value="${it.cantidad}"></div>
        <div class="campo"><label>Precio unit.</label><input type="number" data-item="precio" data-idx="${idx}" value="${it.precio}"></div>
        <div class="campo"><label>Descripción</label><input data-item="descripcion" data-idx="${idx}" value="${escapeHTML(it.descripcion)}"></div>
        <button class="icon-btn" data-quitar-item="${idx}" style="margin-bottom:15px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">${iconoSvg('trash')}</svg></button>
      </div>`).join('');
  }

  abrirModal({
    titulo: editando?`Editar presupuesto #${p.numero}`:'Nuevo presupuesto', ancho:true,
    cuerpoHTML:`
      <datalist id="lista_servicios_p">${STATE.servicios.map(s=>`<option value="${escapeHTML(s.nombre)}" data-precio="${s.precioBase}">`).join('')}</datalist>
      <div class="fila-campos tres">
        <div class="campo"><label>Cliente <span class="req">*</span></label><input id="p_cliente" list="lista_clientes_p" value="${escapeHTML(p.cliente)}"><datalist id="lista_clientes_p">${nombresClientes.map(n=>`<option value="${escapeHTML(n)}">`).join('')}</datalist></div>
        <div class="campo"><label>Contacto</label><input id="p_contacto" value="${escapeHTML(p.contacto)}"></div>
        <div class="campo"><label>Estado</label><select id="p_estado">${['borrador','enviado','aprobado','rechazado','vencido'].map(e=>`<option value="${e}" ${p.estado===e?'selected':''}>${capitaliza(e)}</option>`).join('')}</select></div>
      </div>
      <div class="fila-campos">
        <div class="campo"><label>Fecha</label><input type="date" id="p_fecha" value="${p.fecha}"></div>
        <div class="campo"><label>Válido hasta</label><input type="date" id="p_validez" value="${p.validez}"></div>
      </div>
      <hr class="linea">
      <div id="itemsPresu">${filasItems()}</div>
      <button class="btn outline chico" id="btnAgregarItem" style="margin-top:6px;">+ Agregar servicio</button>
      <hr class="linea">
      <div class="fila-campos tres">
        <div class="campo"><label>Descuento (%)</label><input type="number" id="p_descuento" value="${p.descuento}"></div>
        <div class="campo"><label>Adicionales ($)</label><input type="number" id="p_adicionales" value="${p.adicionales}"></div>
        <div class="campo"><label>Forma de pago</label><input id="p_formaPago" value="${escapeHTML(p.formaPago)}"></div>
      </div>
      <div class="campo"><label>Condiciones</label><textarea id="p_condiciones">${escapeHTML(p.condiciones)}</textarea></div>
      <div class="campo"><label>Notas</label><textarea id="p_notas">${escapeHTML(p.notas)}</textarea></div>
      <div class="total-final">Total: <span id="totalPresuLive">${moneda(totalPresupuesto(p))}</span></div>
    `,
    footerHTML:`<button class="btn outline" id="btnCancelarPresu">Cancelar</button><button class="btn rosa" id="btnGuardarPresu">Guardar</button>`,
    onAbrir:()=>{
      function recalcular(){
        const desc = Number(document.getElementById('p_descuento').value)||0;
        const adic = Number(document.getElementById('p_adicionales').value)||0;
        const sub = p.items.reduce((a,it)=>a+(Number(it.precio||0)*Number(it.cantidad||1)),0);
        const total = sub - (sub*desc/100) + adic;
        document.getElementById('totalPresuLive').textContent = moneda(total);
      }
      function reRenderItems(){
        document.getElementById('itemsPresu').innerHTML = filasItems();
        ligarEventosItems();
        recalcular();
      }
      function ligarEventosItems(){
        document.querySelectorAll('[data-item]').forEach(inp=>{
          inp.oninput = ()=>{
            const idx = Number(inp.dataset.idx); const campo = inp.dataset.item;
            p.items[idx][campo] = campo==='cantidad'||campo==='precio' ? Number(inp.value) : inp.value;
            recalcular();
          };
          inp.onchange = ()=>{
            if(inp.dataset.item==='servicio'){
              const s = STATE.servicios.find(x=>x.nombre===inp.value);
              if(s){ p.items[Number(inp.dataset.idx)].precio = s.precioBase; reRenderItems(); }
            }
          };
        });
        document.querySelectorAll('[data-quitar-item]').forEach(b=>b.onclick=()=>{
          if(p.items.length<=1){ toast('Debe quedar al menos un ítem','error'); return; }
          p.items.splice(Number(b.dataset.quitarItem),1); reRenderItems();
        });
      }
      ligarEventosItems();
      document.getElementById('btnAgregarItem').onclick = ()=>{ p.items.push({servicio:'',descripcion:'',cantidad:1,precio:0}); reRenderItems(); };
      document.getElementById('p_descuento').oninput = recalcular;
      document.getElementById('p_adicionales').oninput = recalcular;
      document.getElementById('btnCancelarPresu').onclick = cerrarModal;
      document.getElementById('btnGuardarPresu').onclick = ()=>{
        const cliente = val('p_cliente');
        if(!cliente){ toast('El cliente es obligatorio','error'); return; }
        const datos = {cliente, contacto:val('p_contacto'), estado:val('p_estado'), fecha:val('p_fecha'), validez:val('p_validez'),
          items:p.items, descuento:Number(val('p_descuento'))||0, adicionales:Number(val('p_adicionales'))||0,
          formaPago:val('p_formaPago'), condiciones:val('p_condiciones'), notas:val('p_notas'), numero:p.numero};
        if(editando) Object.assign(p, datos); else STATE.presupuestos.push({id:uid('pre'), ...datos});
        cerrarModal(); marcarCambio(renderPagina); toast(editando?'Presupuesto actualizado':'Presupuesto creado','exito');
      };
    }
  });
}

function verPresupuesto(id){

  const logo = STATE.config.logoBase64
    ? `<img src="${STATE.config.logoBase64}" style="max-height:50px;">`
